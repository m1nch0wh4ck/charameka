        "style 안의 필드(예: width:{{호감도}}%)도 생성된 값으로 바뀝니다. 필드 설명에 값 형식을 적어 주세요.",
        "<style>은 지원하지 않으므로 인라인 style로",
        "채팅방 색: 지문 hsl(var(--chat-message-text)) / 대사 hsl(var(--chat-dialogue-text)) / 배경 hsl(var(--chat-message-box-background))"] },
    "루모:소개문": { max: 50000, notes: ["캐릭터 소개문. 50,000자 이내", "별도의 기능 제한 안내 없음", "{{user}} 사용 가능"] },
  };
  const PV_PLATFORMS = ["멜로이", "루모"], PV_KINDS = ["상태창", "소개문"];
  const PV_WIDTHS = [["380", "모바일 380"], ["768", "태블릿 768"], ["full", "PC 전체 폭"]];
  // 루모 채팅방 색 변수(hsl 값)를 비슷하게 채워 둡니다. 실제 색은 플랫폼 테마에 따라 다릅니다.
  const PV_THEME = {
    light: { bg: "#ffffff", ink: "#1f2328", text: "220 9% 30%", dialogue: "220 13% 10%", box: "220 14% 96%" },
    dark: { bg: "#17191c", ink: "#e6e8eb", text: "220 9% 72%", dialogue: "220 13% 94%", box: "220 9% 16%" },
  };
  const PV_VAR = /\{\{\s*([^{}\n]+?)\s*\}\}/g, PV_USER = /\{\{\s*user\s*\}\}/gi;
  const FULL_DOC = /^\s*(?:<!--[\s\S]*?-->\s*)*(?:<!doctype|<html[\s>])/i;
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const PV = (() => {
    const s = store.get(PREVIEW_KEY) || {};
    return { slot: own(PV_SLOTS, s.slot) ? s.slot : "멜로이:상태창", width: PV_WIDTHS.some(([w]) => w === s.width) ? s.width : "380",
             bg: s.bg === "dark" ? "dark" : "light", subst: s.subst !== false, apply: s.apply !== false, scripts: s.scripts === true,
             slots: s.slots && typeof s.slots === "object" ? s.slots : {}, saveOk: true };
  })();
  function pvData(id) {
    let d = PV.slots[id];
    if (!d || typeof d !== "object") d = PV.slots[id] = {};
    if (typeof d.html !== "string") d.html = "";
    if (!d.vars || typeof d.vars !== "object") d.vars = {};
    return d;
  }
  function pvSave() {
    PV.saveOk = store.set(PREVIEW_KEY, { slot: PV.slot, width: PV.width, bg: PV.bg, subst: PV.subst, apply: PV.apply, scripts: PV.scripts, slots: PV.slots });
  }
  function pvVars(html) {
    const found = new Map();
    for (const m of html.matchAll(PV_VAR)) found.set(m[1], (found.get(m[1]) || 0) + 1);
    return found;
  }
  const pvLineList = (src, re) => [...new Set([...src.matchAll(re)].map((m) => E.splitlines(src.slice(0, m.index) + "x").length))];
  const pvLines = (lines) => (lines.length ? ` · ${lines.slice(0, 10).join(", ")}번째 줄` + (lines.length > 10 ? " 외" : "") : "");
  const tagRe = (tag) => new RegExp(`<${tag.replace(/[^\w-]/g, "")}(?=[\\s/>])`, "gi");

  // ── 플랫폼 규칙 흉내: 막히는 태그·속성을 찾아 빼고, 무엇을 왜 뺐는지 적습니다 (실제 플랫폼 처리와 다를 수 있음) ──
  // 내용째 빼는 태그 (나머지는 태그만 빼고 글자는 남김)
  const PV_DROP = tagSet("script style iframe embed object svg math video audio img picture source track canvas input textarea select button option template noscript link meta title base frame frameset");
  const PV_URL_ATTRS = ["href", "src", "action", "formaction", "xlink:href", "poster", "background", "data"];
  const pvHost = (url) => { try { return new URL(url, "https://x.invalid/").hostname; } catch { return ""; } };
  function pvRules(rule, src, html) {
    const report = [];
    if (!rule.allow && !rule.intro) return { html, report };
    const full = FULL_DOC.test(html);
    const doc = new DOMParser().parseFromString(full ? html : `<!doctype html><body>${html}`, "text/html");
    const written = new Set([...html.matchAll(/<([a-zA-Z][\w-]*)/g)].map((m) => m[1].toLowerCase()));  // 브라우저가 스스로 넣는 tbody 등은 빼고 셈
    const found = new Map();
    const note = (key, status, title, detail, lines) => {
      const r = found.get(key) || { status, title, detail, lines, n: 0 };
      r.n++; found.set(key, r);
    };
    const drop = (el, key, title, why) => {
      const whole = PV_DROP.has(el.localName);
      note(key, "fail", title, `${why} → ${whole ? "내용째 뺌" : "태그만 빼고 글자는 남김"}`, pvLineList(src, tagRe(el.localName)));
      if (whole) el.remove(); else el.replaceWith(...el.childNodes);
    };
    const styles = [];
    for (const root of full ? [doc.head, doc.body] : [doc.body]) for (const el of [...root.querySelectorAll("*")]) {
      if (!el.isConnected) continue;
      const tag = el.localName;
      if (rule.allow && !rule.allow.has(tag) && written.has(tag)) { drop(el, `tag:${tag}`, `<${tag}> 허용되지 않는 태그`, "허용 목록에 없음"); continue; }
      if (rule.deny && rule.deny.has(tag)) { drop(el, `tag:${tag}`, `<${tag}> 쓸 수 없는 태그`, "소개 페이지에서 금지"); continue; }
      for (const a of [...el.attributes]) {
        if (/^on/i.test(a.name)) {
          el.removeAttribute(a.name);
          note("on", "fail", "on… 이벤트 속성 (JS)", "자바스크립트는 실행되지 않음 → 속성을 뺌", pvLineList(src, /\son[a-z]+\s*=/gi));
        } else if (PV_URL_ATTRS.includes(a.name.toLowerCase()) && /^\s*javascript:/i.test(a.value)) {
          el.removeAttribute(a.name);
          note("js-url", "fail", "javascript: 주소", "자바스크립트는 실행되지 않음 → 속성을 뺌", pvLineList(src, /javascript:/gi));
        }
      }
      if (!rule.intro) continue;
      if (tag === "img" && !/^\s*https:\/\//i.test(el.getAttribute("src") || "")) {
        drop(el, "img-https", "https가 아닌 이미지", "이미지는 외부 https 주소만"); continue;
      }
      if (tag === "link" && /stylesheet/i.test(el.getAttribute("rel") || "") && pvHost(el.getAttribute("href") || "") !== "fonts.googleapis.com") {
        drop(el, "link-host", "Google Fonts가 아닌 외부 CSS", "외부 CSS는 fonts.googleapis.com만"); continue;
      }
      if (tag === "style") {
        const bad = [...el.textContent.matchAll(/@import\s+(?:url\(\s*)?["']?([^"')\s;]+)/gi)].map((m) => m[1]).filter((u) => pvHost(u) !== "fonts.googleapis.com");
        if (bad.length) { drop(el, "style-import", "다른 호스트를 @import하는 <style>", `${bad[0]} — 블록이 통째로 빠짐`); continue; }
        styles.push(el);
      }
      if (tag === "a" && (el.getAttribute("href") || "").trim().startsWith("#"))
        note("anchor", "warn", "앵커(#id) 이동", "지침상 쓰지 않음 (탭·슬라이더는 radio + :checked 또는 scroll-snap)", pvLineList(src, /href\s*=\s*["']?#/gi));
    }
    if (rule.intro) {
      if (styles.length > 1) note("style-count", "warn", `<style> 블록이 ${styles.length}개입니다`, "지침상 <style> 블록은 1개", pvLineList(src, tagRe("style")));
      const tops = [...doc.body.childNodes].filter((n) => n.nodeType === 1 ? n.localName !== "style" && n.localName !== "link" : n.nodeType === 3 && n.textContent.trim());
      if (tops.length !== 1 || tops[0].localName !== "div") note("root", "warn", "루트가 <div> 하나가 아닙니다", "지침상 HTML 전체를 <div> 하나로 감쌈", []);
    }
    for (const r of found.values()) report.push({ status: r.status, title: r.n > 1 ? `${r.title} (${r.n}곳)` : r.title, detail: r.detail + pvLines(r.lines) });
    report.sort((a, b) => (a.status === "fail" ? 0 : 1) - (b.status === "fail" ? 0 : 1));
    return { html: (full ? doc.head.innerHTML : "") + doc.body.innerHTML, report };
  }

  /** 미리보기에만 쓰는 문서. 입력은 그대로 두고, 치환 → 플랫폼 규칙 → (조각이면) 최소 뼈대로 감싸기 순서로 만듭니다. */
  function pvBuild(id, d) {
    const rule = PV_SLOTS[id];
    let html = d.html;
    if (PV.subst) html = html.replace(PV_VAR, (all, name) =>
      (own(d.vars, name) && d.vars[name] && !(rule.spaceVar && /\s/.test(name)) ? d.vars[name] : all));
    const checked = pvRules(rule, d.html, html);
    if (PV.apply) html = checked.html;
    if (FULL_DOC.test(html)) return { doc: html, report: checked.report };
    const t = PV_THEME[PV.bg];
    const doc = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">`
      + `<style>:root{color-scheme:${PV.bg};--chat-message-text:${t.text};--chat-dialogue-text:${t.dialogue};--chat-message-box-background:${t.box}}`
      + `html,body{margin:0}body{padding:12px;background:${t.bg};color:${t.ink};`
      + `font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}</style>`
      + `</head><body>${html}</body></html>`;
    return { doc, report: checked.report };
  }
  function pvSetHtml(id, text) {
    pvData(id).html = text; pvSave();
    if (S.view.kind === "preview" && PV.slot === id) renderEditor();
  }
  function pvCount(id) {
    const rule = PV_SLOTS[id], n = E.countChars(pvData(id).html, true), [rec] = E.recommendedLine({ "최대": rule.max }, S.rules.config);
    return { n, rec, state: n > rule.max ? "fail" : n > rec ? "warn" : "" };
  }

  function renderPreview(ed) {
    const id = PV.slot, rule = PV_SLOTS[id], d = pvData(id);
    const [platform, kind] = id.split(":");
    const pick = (patch) => { Object.assign(PV, patch); pvSave(); renderEditor(); };
    const seg = (label, options, cur, onPick) => h("div", { class: "seg", role: "group", "aria-label": label },
      ...options.map(([v, text]) => h("button", { type: "button", "aria-pressed": String(v === cur), text, onclick: () => onPick(v) })));
    let timer = null;
    const refresh = () => { const r = pvBuild(id, d); frame.srcdoc = r.doc; renderReport(r.report); };
    const later = () => { clearTimeout(timer); timer = setTimeout(() => { refresh(); pvSave(); saveNote(); }, 300); };

    // 입력 칸
    const ta = h("textarea", { class: "pv-input", id: "pv-input", spellcheck: false, autocapitalize: "off", autocomplete: "off", autocorrect: "off",
      "aria-label": `${platform} ${kind} HTML`, placeholder: "여기에 HTML을 붙여넣으세요. <html>·<body> 없는 조각이어도 됩니다." });
    ta.value = d.html;
    ta.addEventListener("input", () => { d.html = ta.value; updCount(); renderVars(); later(); });

    // 글자 수 (다른 칸과 같은 UTF-16 · 공백 포함 기준)
    const meter = h("div", { class: "meter pv-meter" }), msgs = h("div", { class: "pv-col" });
    const updCount = () => {
      const { n, rec, state } = pvCount(id), recName = E.recommendedLine({ "최대": rule.max }, S.rules.config)[1];
      meter.className = `meter pv-meter ${state}`;
      meter.replaceChildren(
        h("div", { class: "meter-label" }, h("span", { text: `글자 수 (최대 ${fmt(rule.max)}자 · ${recName} ${fmt(rec)}자)` }),
          h("span", { class: "tnum" }, h("b", { text: fmt(n) }), h("small", { text: ` / ${fmt(rule.max)} · ${Math.round((n / rule.max) * 100)}%` }))),
        h("div", { class: "meter-track", role: "meter", "aria-label": "글자 수", "aria-valuemin": "0", "aria-valuemax": String(rule.max), "aria-valuenow": String(n) },
          h("div", { class: "meter-fill", style: `width:${Math.min(100, (n / rule.max) * 100)}%` }),
          h("div", { class: "pv-mark", style: `left:${(rec / rule.max) * 100}%`, title: `${recName} ${fmt(rec)}자` })));
      const lines = [];
      if (n > rule.max) lines.push(["fail", `✕ 최대 ${fmt(rule.max)}자를 넘었습니다 (+${fmt(n - rule.max)}자)`]);
      else if (n > rec) lines.push(["warn", `▲ ${recName}선 ${fmt(rec)}자를 넘었습니다 (+${fmt(n - rec)}자)`]);
      const users = rule.noUser ? pvLineList(d.html, PV_USER) : [];
      if (users.length) lines.push(["fail", `✕ ${platform} ${kind}에는 {{user}} 대신 '유저'로 써 주세요${pvLines(users)}`]);
      const spaced = rule.spaceVar ? [...pvVars(d.html).keys()].filter((name) => /\s/.test(name)) : [];
      if (spaced.length) lines.push(["fail", `✕ 변수 이름에 공백이 있어 토큰으로 쓸 수 없습니다: ${spaced.map((s) => `{{${s}}}`).join(", ")}`]);
      msgs.replaceChildren(...lines.map(([st, text]) => h("p", { class: `pv-msg ${st}`, text })));
    };

    // 플랫폼 규칙 검사 결과
    const reportBox = h("div", { class: "pv-col" });
    const renderReport = (report) => {
      if (!rule.allow && !rule.intro) { reportBox.replaceChildren(h("p", { class: "muted", text: "별도의 기능 제한 안내가 없어 태그를 검사하지 않습니다." })); return; }
      if (!d.html.trim()) { reportBox.replaceChildren(); return; }
      if (!report.length) { reportBox.replaceChildren(h("p", { class: "pv-msg", text: "✓ 막히는 태그·속성이 없습니다." })); return; }
      reportBox.replaceChildren(...report.map((i) => h("div", { class: `issue ${i.status}` },
        h("span", { class: "issue-title", text: (i.status === "fail" ? "✕ " : "▲ ") + i.title }),
        h("span", { class: "issue-detail", text: i.detail }))));
    };

    // 변수 치환: {{...}} 를 찾아 임시 값을 넣음 (미리보기에만 반영)
    const varList = h("div", { class: "pv-vars" });
    const renderVars = () => {
      const found = pvVars(d.html);
      if (!found.size) { varList.replaceChildren(h("p", { class: "muted", text: "{{user}}, {{char}} 같은 변수가 없습니다." })); return; }
      varList.replaceChildren(...[...found].map(([name, count]) => {
        const inp = h("input", { class: "input", id: `pv-var-${encodeURIComponent(name)}`, value: own(d.vars, name) ? d.vars[name] : "",
          placeholder: "비우면 그대로 표시", "aria-label": `{{${name}}} 값`, autocapitalize: "off", autocomplete: "off",
          oninput: () => { d.vars[name] = inp.value; later(); } });
        return h("label", { class: "pv-var" }, h("code", {}, `{{${name}}}`, h("small", { text: `×${count}` })), inp);
      }));
    };

    // 붙여넣기 · 지우기
    const pasteBtn = h("button", { class: "btn primary", type: "button", text: "붙여넣기", onclick: async () => {
      let text = null;
      try { text = await navigator.clipboard.readText(); } catch { text = null; }
      if (text == null) { ta.focus(); toast("자동 붙여넣기가 막혀 있습니다. 칸을 길게 눌러 붙여넣어 주세요."); return; }
      if (!text.trim()) { toast("클립보드가 비어 있습니다."); return; }
      const prev = d.html;
      pvSetHtml(id, text);
      toast("붙여넣었습니다.", prev.trim() ? { label: "되돌리기", run: () => pvSetHtml(id, prev) } : null);
    } });
    const clearBtn = h("button", { class: "btn quiet", type: "button", text: "지우기", onclick: () => {
      const prev = d.html;
      if (!prev) return;
      pvSetHtml(id, "");
      toast("지웠습니다.", { label: "되돌리기", run: () => pvSetHtml(id, prev) });
    } });

    // 규정 안내
    const ruleBox = h("details", { class: "guide pv-rule" }, h("summary", { text: `${platform} ${kind} 규정 보기` }),
      h("ul", {}, ...rule.notes.map((n) => h("li", { text: n }))),
      ...(rule.tagGroups ? Object.entries(rule.tagGroups).flatMap(([title, rows]) => [h("p", { class: "muted", text: title }),
        ...rows.map(([group, tags]) => h("div", { class: "chips" }, group ? h("span", { class: "muted", text: group }) : null,
          ...tags.split(" ").map((t) => h("span", { class: "chip", text: t }))))]) : []));

    // 미리보기
    const frame = h("iframe", { class: "pv-frame", title: `${platform} ${kind} 미리보기`, sandbox: PV.scripts ? "allow-scripts" : "", referrerpolicy: "no-referrer" });
    frame.style.width = PV.width === "full" ? "100%" : `${PV.width}px`;
    const saveLine = h("p", { class: "muted" });
    const saveNote = () => { saveLine.textContent = PV.saveOk ? "입력 내용과 변수 값은 이 기기에 자동 저장됩니다." : "이 기기에 저장할 수 없어, 새로고침하면 입력 내용이 지워집니다."; };

    const substBox = h("input", { type: "checkbox", id: "pv-subst", checked: PV.subst, onchange: () => { PV.subst = substBox.checked; later(); } });
    const applyBox = h("input", { type: "checkbox", id: "pv-apply", checked: PV.apply, onchange: () => { PV.apply = applyBox.checked; later(); } });
    const scriptBox = h("input", { type: "checkbox", id: "pv-scripts", checked: PV.scripts, onchange: () => pick({ scripts: scriptBox.checked }) });

    updCount(); renderVars(); saveNote(); refresh();
    ed.replaceChildren(
      h("div", { class: "ed-head" }, h("span", { class: "ed-crumb", text: "HTML 미리보기" }), h("h2", { class: "ed-title", text: `${platform} ${kind}` })),
      h("div", { class: "seg-row" },
        seg("플랫폼", PV_PLATFORMS.map((p) => [p, p]), platform, (p) => pick({ slot: `${p}:${kind}` })),
        seg("종류", PV_KINDS.map((k) => [k, k]), kind, (k) => pick({ slot: `${platform}:${k}` }))),
      h("div", { class: "pv" },
        h("div", { class: "pv-col pv-edit" },
          ruleBox, ta,
          h("div", { class: "quick" }, pasteBtn, clearBtn),
          meter, msgs,
          h("div", { class: "seg-row" }, h("h3", { class: "group-title", text: "플랫폼 규칙 검사" }),
            rule.allow || rule.intro ? h("label", { class: "check" }, applyBox, "미리보기에 적용 (막힌 것 빼고 보기)") : null),
          reportBox,
          h("div", { class: "seg-row" }, h("h3", { class: "group-title", text: "변수 치환" }),
            h("label", { class: "check" }, substBox, "미리보기에 치환 적용")),
          varList, saveLine),
        h("div", { class: "pv-col pv-view" },
          h("div", { class: "seg-row" },
            seg("미리보기 폭", PV_WIDTHS, PV.width, (w) => pick({ width: w })),
            seg("배경", [["light", "밝게"], ["dark", "어둡게"]], PV.bg, (b) => pick({ bg: b }))),
          h("div", { class: "pv-stage" }, frame),
          h("p", { class: "muted", text: "규칙 검사는 공개된 플랫폼 규정을 흉내 낸 것이라, 실제 플랫폼 처리와 다를 수 있습니다." }),
          h("label", { class: "check" }, scriptBox, "스크립트 실행 허용 (보통은 끔)"))));
  }

  // ── 시작 ──
  $("menu-btn").addEventListener("click", openMenu);
  $("back-btn").addEventListener("click", () => go({ kind: S.view.kind === "home" || S.view.kind === "preview" ? "start" : "home" }));
  if (APP) document.title = APP === "html" ? "상태창·소개문 HTML 미리보기" : "경량봇 작성기";
  $("issues-btn").addEventListener("click", openIssues);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("layer").replaceChildren(); });
  // 휴대폰 키보드가 화면을 가리고 있을 때만 아래 계기판을 잠시 숨깁니다
  const typingTarget = (el) => el && (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && el.type !== "file")) && !el.closest(".sheet");
  const updTyping = () => {
    const vv = window.visualViewport;
    const keyboard = vv ? vv.height < window.innerHeight * 0.8 : true;
    document.body.classList.toggle("typing", typingTarget(document.activeElement) && keyboard && matchMedia("(max-width: 899px)").matches);
  };
  document.addEventListener("focusin", updTyping);
  document.addEventListener("focusout", () => setTimeout(updTyping, 0));
  window.visualViewport?.addEventListener("resize", updTyping);

  const savedMode = store.get(MODE_KEY);
  S.mode = MODES.includes(savedMode) ? savedMode : MODES[0];
  try {
    loadRules();
  } catch {
    store.del(RULES());
    loadRules();
  }
  loadDraft();
  recompute();
  go(firstView());
})();
</script>
