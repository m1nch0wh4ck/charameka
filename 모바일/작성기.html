<title>경량봇 작성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 휴대폰은 [목차] ↔ [칸 편집] 한 화면씩, 넓은 화면은 목차 | 편집 두 칸. 아래에는 글자 수 계기판이 늘 붙어 있음 */
:root {
  --bg: #f2f5f4; --surface: #ffffff; --sunken: #e8eeec; --ink: #17201e; --muted: #5a6a66; --line: #d6dfdc;
  --accent: #0d6b63; --accent-ink: #ffffff; --accent-soft: #dcefec;
  --ok: #1d7a3a; --warn: #a15f00; --fail: #b3242b; --warn-soft: #fbefdc; --fail-soft: #fbe3e3;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-display: "Gowun Batang", "AppleMyungjo", "Batang", serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1413; --surface: #151d1b; --sunken: #1b2523; --ink: #e2ebe8; --muted: #94a6a1; --line: #263330;
  --accent: #52c2b3; --accent-ink: #062320; --accent-soft: #173431;
  --ok: #5fc47c; --warn: #e3a54a; --fail: #f07b74; --warn-soft: #33281a; --fail-soft: #3a1f1f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #151d1b; --sunken: #1b2523; --ink: #e2ebe8; --muted: #94a6a1; --line: #263330;
  --accent: #52c2b3; --accent-ink: #062320; --accent-soft: #173431;
  --ok: #5fc47c; --warn: #e3a54a; --fail: #f07b74; --warn-soft: #33281a; --fail-soft: #3a1f1f; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tnum { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 12.5px; letter-spacing: 0.01em; }

/* 위쪽 막대 */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.topbar h1 { margin: 0; font: 700 19px/1.2 var(--font-display); letter-spacing: -0.01em; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar h1 small { font: 500 12px var(--font-body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 500; font-size: 14px; }
.icon-btn[hidden] { display: none !important; }
@media (min-width: 900px) { #back-btn { display: none !important; } }

/* 본문 */
.shell { max-width: 1100px; margin: 0 auto; padding: 14px 16px 120px; display: grid; gap: 18px; }
@media (min-width: 900px) { .shell { grid-template-columns: 320px minmax(0, 1fr); align-items: start; }
  .nav { position: sticky; top: 72px; max-height: calc(100vh - 170px); overflow: auto; } }
@media (max-width: 899px) { body[data-view="home"] .editor, body:not([data-view="home"]) .nav { display: none; } }
body[data-view="start"] .nav, body[data-view="start"] .meter-bar, body[data-view="start"] #issues-btn { display: none !important; }
body[data-view="start"] .shell { grid-template-columns: minmax(0, 1fr); max-width: 560px; padding-bottom: 40px; }

/* 시작 화면: 할 일을 먼저 고름 */
.start { display: grid; gap: 14px; padding-top: 6px; }
.start-lead { margin: 0; color: var(--muted); font-size: 14px; }
.start-card { display: grid; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.start-card.accent { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.start-card b { font: 700 19px/1.3 var(--font-display); }
.start-card .sub { color: var(--muted); font-size: 13.5px; }
.start-card .tnum { color: var(--muted); margin-top: 4px; }
.start-card.accent .tnum { color: var(--accent); }
.start-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

/* 목차 */
.draft { display: grid; gap: 6px; padding-block: 4px 10px; }
.draft-name { font: 700 24px/1.25 var(--font-display); text-wrap: balance; margin: 0; }
.draft-meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.quick-home { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick-home .primary { grid-column: 1 / -1; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 9px 14px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 45%, var(--line)); }
.btn:disabled { opacity: 0.5; cursor: default; }
.part { margin-top: 14px; }
.size-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; }
.size-box.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); } .size-box.fail { border-color: color-mix(in srgb, var(--fail) 50%, var(--line)); }
.size-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 600; color: var(--muted); }
.size-head b { font-size: 18px; color: var(--ink); }
.size-box.warn .size-head b { color: var(--warn); } .size-box.fail .size-head b { color: var(--fail); }
.size-tokens { margin: 0; font-size: 13px; color: var(--accent); font-weight: 500; text-align: right; }
.size-rows { list-style: none; margin: 2px 0 0; padding: 6px 0 0; border-top: 1px solid var(--line); display: grid; gap: 4px; font-size: 14px; }
.size-rows li { display: flex; justify-content: space-between; gap: 8px; }
.size-rows small { margin-left: 6px; font-size: 12px; color: var(--muted); }
.size-foot { margin: 0; font-size: 12px; color: var(--muted); }
.part-title { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px 2px; }
.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.items li + li { border-top: 1px solid var(--line); }
.nav-item { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 11px 14px; background: none; border: 0; text-align: left; }
.nav-item[aria-current="true"] { background: var(--accent-soft); }
.nav-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .sub { display: block; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.fail { background: var(--fail); }

/* 칸 편집 */
.editor { min-width: 0; display: grid; gap: 12px; }
.ed-head { display: grid; gap: 2px; }
.ed-crumb { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.ed-title { margin: 0; font: 700 22px/1.3 var(--font-display); text-wrap: balance; }
.guide { background: var(--sunken); border-radius: var(--radius); padding: 10px 14px; }
.guide summary { cursor: pointer; font-weight: 500; color: var(--muted); font-size: 14px; }
.guide pre { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.6 var(--font-body); color: var(--muted); }
.field { width: 100%; min-height: 46vh; resize: vertical; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px 14px; line-height: 1.7; field-sizing: content; }
.field:focus { border-color: var(--accent); outline: none; }
.ed-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); }
.pager { display: flex; gap: 8px; }

/* 변수·로어북 카드 */
.group-title { margin: 10px 0 0; font-size: 15px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }
.card.warn { border-color: var(--fail); background: var(--fail-soft); }
.card-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.card-head .name-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
label.tag { display: grid; gap: 4px; }
.tag-name { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-data); font-size: 12.5px; color: var(--muted); }
.tag-name .over { color: var(--fail); font-weight: 500; }
.input, .area, select.input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.area { min-height: 72px; resize: vertical; line-height: 1.6; field-sizing: content; }
.input:focus, .area:focus { border-color: var(--accent); outline: none; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.confirm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--fail); font-size: 14px; }
.mode-pill { justify-self: start; border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); border-radius: 999px;
  padding: 3px 12px; font-size: 13px; font-weight: 600; }
.nav-item.add-row .name { color: var(--accent); font-weight: 600; }
.area.tall { min-height: 120px; }
.card-sec { display: grid; gap: 6px; }
.card-sec .tag-name b { color: var(--ink); font-family: var(--font-body); font-size: 15px; }

/* 아래 계기판 */
.meter-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); }
body.typing .meter-bar { display: none; }
.meter-inner { max-width: 1100px; margin: 0 auto; }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.meter { display: grid; gap: 3px; min-width: 0; }
.meter-label { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.meter-label b { color: var(--ink); font-weight: 500; }
.meter-label small { font-size: 11px; }
.meter-track { height: 5px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.meter-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s; }
.meter.warn .meter-fill { background: var(--warn); } .meter.fail .meter-fill { background: var(--fail); }
.meter.warn .meter-label b, .meter.warn .meter-label span { color: var(--warn); }
.meter.fail .meter-label b, .meter.fail .meter-label span { color: var(--fail); }
.issues-btn { border: 0; border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 14px; background: var(--sunken); white-space: nowrap; }
.issues-btn.warn { background: var(--warn-soft); color: var(--warn); } .issues-btn.fail { background: var(--fail-soft); color: var(--fail); }
.issues-btn.ok { color: var(--ok); }

/* 아래에서 올라오는 창 */
.scrim { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, #000 40%, transparent); display: grid; align-items: end; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; margin: 0 auto; border-radius: 16px 16px 0 0; max-height: 86vh; overflow: auto;
  padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.sheet h2 { margin: 0; font: 700 19px/1.3 var(--font-display); }
.sheet p { margin: 0; }
.sheet .muted, .muted { color: var(--muted); font-size: 13.5px; }
.menu-list { display: grid; gap: 2px; }
.menu-list button { text-align: left; background: none; border: 0; border-radius: 8px; padding: 11px 10px; display: grid; gap: 1px; }
.menu-list button:hover { background: var(--sunken); }
.menu-list button span { color: var(--muted); font-size: 13px; }
.menu-sep { height: 1px; background: var(--line); margin: 6px 0; }
.issue { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; display: grid; gap: 4px; }
.issue.warn { border-color: var(--warn); } .issue.fail { border-color: var(--fail); }
.issue-title { font-weight: 600; }
.issue.warn .issue-title { color: var(--warn); } .issue.fail .issue-title { color: var(--fail); }
.issue-detail { white-space: pre-wrap; word-break: break-word; color: var(--muted); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
.paste-area { width: 100%; min-height: 40vh; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 600; margin-left: 8px; }
@media (prefers-reduced-motion: reduce) { .meter-fill { transition: none; } }

/* HTML 미리보기: 휴대폰은 입력 → 미리보기 세로로, 넓은 화면은 입력 | 미리보기 두 칸. 목차·계기판·점검은 숨김 */
body[data-view="preview"] .nav, body[data-view="preview"] .meter-bar, body[data-view="preview"] #issues-btn { display: none !important; }
body[data-view="preview"] .shell { grid-template-columns: minmax(0, 1fr); max-width: 1600px; }
body[data-view="preview"] .topbar-inner { max-width: 1600px; }
@media (min-width: 900px) { body[data-view="preview"] #back-btn { display: inline-block !important; } }
.pv { display: grid; gap: 14px; }
.pv-col { display: grid; gap: 12px; align-content: start; min-width: 0; }
@media (min-width: 1100px) { .pv { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; }
  .pv-view { position: sticky; top: 72px; } }
.seg-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pv-input { width: 100%; min-height: 32vh; resize: vertical; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; font: 13.5px/1.55 var(--font-data); tab-size: 2; }
.pv-input:focus { border-color: var(--accent); outline: none; }
@media (max-width: 899px) { .pv-input, .pv-var .input { font-size: 16px; } }  /* 아이폰에서 입력할 때 화면이 확대되지 않게 */
.pv-meter .meter-track { position: relative; height: 6px; }
.pv-mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--muted); opacity: 0.6; }
.pv-msg { margin: 0; font-size: 13.5px; }
.pv-msg.warn { color: var(--warn); } .pv-msg.fail { color: var(--fail); }
.pv-vars { display: grid; gap: 8px; }
.pv-var { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px; align-items: center; }
.pv-var code { font: 12.5px var(--font-data); overflow-wrap: anywhere; }
.pv-var code small { color: var(--muted); margin-left: 4px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.pv-stage { height: 70vh; min-height: 240px; resize: vertical; overflow: auto; background: var(--sunken); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 10px; }
.pv-frame { display: block; height: 100%; margin: 0 auto; border: 1px dashed var(--line); border-radius: 6px; background: #fff; }
.pv-rule ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; }
.pv-rule .chips { margin-top: 4px; }
.pv-rule .chip { font-family: var(--font-data); font-size: 12px; }
</style>

<header class="topbar"><div class="topbar-inner">
  <button class="icon-btn" id="back-btn" type="button" hidden>‹ 목차</button>
  <h1 id="top-title">경량봇 작성기</h1>
  <button class="issues-btn" id="issues-btn" type="button">점검</button>
  <button class="icon-btn" id="menu-btn" type="button">메뉴</button>
</div></header>

<main class="shell">
  <nav class="nav" id="nav" aria-label="칸 목록"></nav>
  <section class="editor" id="editor" aria-live="polite"></section>
</main>

<footer class="meter-bar"><div class="meter-inner">
  <div class="meters" id="meters"></div>
</div></footer>

<div id="layer"></div>
<input type="file" id="file-source" accept=".txt,.md,text/plain,text/markdown" hidden>

<script>
/* ── 작성 엔진: PC판 app.py 의 템플릿 분석·채우기·조립·기계 점검을 그대로 옮긴 것 ── */
const Engine = (() => {
  const PASS = "pass", WARN = "warn", FAIL = "fail", INFO = "info";
  const MD_HEADER = /^\s{0,3}(#{1,6})\s*(.+?)\s*#*\s*$/;
  const VAR_TAG = /^\s*\[([^\]]+)\]\s*(.*)$/;
  const VAR_HEAD = /^\s*\[\s*변수 이름\s*\]\s*(.*)$/;
  const LORE_HEAD = /^\s*(\d+)\s*[.)]\s*트리거\s*[:：]\s*(.*)$/;
  const CARD_HEAD = /^\s*■\s*(캐릭터|주연|조연)\s*[:：]\s*(.*)$/;
  const BULLETS = ["-", "·", "*", "•", "※", "+"];
  const SOURCE_FORM_NOTE = [
    "※ 경량 코어 시트(원자료) 양식입니다. '등장인물', '1. 클리셰 라벨' 같은 제목 줄은 지우거나 고치지 말고, 각 제목 아래에 내용을 채워 주세요.",
    "※ 괄호 ( ) 안 설명이나 'Age:' 처럼 비어 있는 칸은 실제 내용으로 바꿔 주세요.",
    "※ 변수와 로어북은 [변수 이름], [변수 내용], '1. 트리거:' 같은 표시를 그대로 두고 내용만 채워 주세요.",
  ];
  const SOURCE_FORM_NOTE_CARDS = [
    "※ MELLOY 다인챗 원자료 양식입니다. '설명', '1. 시스템', '신상' 같은 제목 줄은 지우거나 고치지 말고, 각 제목 아래에 내용을 채워 주세요.",
    "※ 등장인물 카드는 '■ 캐릭터: 이름' 줄로 시작합니다. 인물마다 이 줄부터 '고정 규칙'까지를 한 벌씩 복사해서 채워 주세요.",
    "※ 조연이 있으면 '■ 조연: 이름' 줄로 시작해서 주연 카드와 같은 칸으로 채워 주세요. 조연이 없으면 '조연' 제목 아래를 비워 두면 됩니다.",
    ...SOURCE_FORM_NOTE.slice(1),
  ];

  // ── 파이썬과 같은 동작을 하는 작은 도구 ──
  const len = (s) => s.length;  // 글자 수: MELLOY·루모 화면과 같은 UTF-16 기준 (이모지는 대부분 2자)
  // 칸별 권장선: 칸에 '권장'·'목표'가 있으면 그 값, 없으면 최대 × 권장_비율(기본 2/3)
  const recommendedLine = (rule, config) => {
    for (const key of ["권장", "목표"]) { const v = Math.trunc(Number(rule[key] || 0)); if (v) return [v, key]; }
    const ratio = Number(config["권장_비율"] ?? 2 / 3);
    return [Math.trunc(Math.trunc(Number(rule["최대"] ?? 0)) * ratio), "권장"];
  };
  const fmt = (n) => n.toLocaleString("en-US");
  const isSpace = (c) => /\s/.test(c);
  const strip = (s) => s.trim();
  const rstrip = (s) => s.replace(/\s+$/, "");
  const stripNL = (s) => s.replace(/^\n+|\n+$/g, "");
  function splitlines(s) {
    if (!s) return [];
    const parts = s.split(/\r\n|\r|\n/);
    if (parts[parts.length - 1] === "") parts.pop();
    return parts;
  }
  const startsWithAny = (s, arr) => arr.some((p) => s.startsWith(p));
  const normalize = (name) => name.replace(/[\s_\-:：·.()\[\]【】]/g, "").toLowerCase();
  const lineOf = (text, pos) => text.slice(0, pos).split("\n").length;
  function fmtLines(lines) {
    const uniq = [...new Set(lines)].sort((a, b) => a - b);
    const shown = uniq.slice(0, 15).join(", ");
    return `${shown}번째 줄` + (uniq.length > 15 ? " 외" : "");
  }
  const item = (status, title, detail = "") => ({ status, title, detail });
  function rpartition(s, sep) {
    const i = s.lastIndexOf(sep);
    return i < 0 ? ["", "", s] : [s.slice(0, i), sep, s.slice(i + sep.length)];
  }
  const countChars = (text, withSpaces) => (withSpaces ? len(strip(text)) : len(text.replace(/\s/g, "")));

  // ── 섹션 ──
  function parseMdSections(text) {
    const lines = splitlines(text);
    const headers = [];
    lines.forEach((l, i) => { const m = l.match(MD_HEADER); if (m) headers.push([i, m[1].length, strip(m[2])]); });
    return headers.map(([idx, level, name], n) => {
      let end = lines.length;
      for (const [i2, lv2] of headers.slice(n + 1)) if (lv2 <= level) { end = i2; break; }
      return { name, level, body: lines.slice(idx + 1, end).join("\n"), start: idx + 2, end };
    });
  }
  function findSection(sections, aliases) {
    const keys = aliases.filter(Boolean).map(normalize);
    return sections.find((s) => keys.includes(normalize(s.name)))
      || sections.find((s) => keys.some((k) => k && normalize(s.name).includes(k))) || null;
  }
  function fieldAliases(field, config) {
    for (const rule of config["글자수_제한"] || [])
      if (normalize(rule["필드"] || "") === normalize(field)) return [field, ...(rule["별칭"] || [])];
    return [field];
  }
  function matchingSections(sections, aliases) {
    if (!sections.length) return [];
    const top = Math.min(...sections.map((s) => s.level));
    const keys = aliases.filter(Boolean).map(normalize);
    return sections.filter((s) => s.level === top && keys.some((k) => normalize(s.name).startsWith(k)));
  }

  // ── 기계 점검 ──
  function checkLengths(sections, config) {
    const items = [];
    const withSpaces = Boolean(config["공백_포함_글자수"] ?? true);
    const basis = withSpaces ? "공백 포함" : "공백 제외";
    for (const rule of config["글자수_제한"] || []) {
      const field = rule["필드"] ?? "?", limit = Math.trunc(Number(rule["최대"] ?? 0));
      const sec = findSection(sections, [field, ...(rule["별칭"] || [])]);
      if (!sec) { items.push(item(WARN, `'${field}' 필드를 찾지 못했습니다`, `헤더 이름을 확인해 주세요. (예: # ${field})`)); continue; }
      const n = countChars(sec.body, withSpaces);
      const [rec, recName] = recommendedLine(rule, config);
      const msg = `${fmt(n)}자 / ${recName} ${fmt(rec)}자 · 최대 ${fmt(limit)}자 (${basis}) · ${sec.start - 1}번째 줄의 '${sec.name}'`;
      if (n > limit) items.push(item(FAIL, `'${field}' 필드 글자 수 초과 (+${fmt(n - limit)}자)`, msg));
      else if (n > rec) items.push(item(WARN, `'${field}' 필드가 ${recName}선을 넘었습니다 (${recName} ${fmt(rec)}자, +${fmt(n - rec)}자)`, msg));
      else items.push(item(PASS, `'${field}' 필드 글자 수 정상`, msg));
    }
    return items;
  }

  function matchBraces(text) {
    const tokens = [...text.matchAll(/\{\{|\}\}/g)].map((m) => [m.index, m[0]]);
    const stack = [], matched = new Set(), stray = [];
    for (const [pos, tok] of tokens) {
      if (tok === "{{") stack.push(pos);
      else if (stack.length) matched.add(stack.pop());
      else stray.push(pos);
    }
    return { tokens, matched, unclosed: stack, stray };
  }
  function linePreview(text, pos, before = false) {
    let snippet;
    if (before) {
      const start = text.lastIndexOf("\n", pos - 1) + 1;
      snippet = Array.from(strip(text.slice(start, pos + 2)));
      snippet = snippet.length > 20 ? "..." + snippet.slice(-20).join("") : snippet.join("");
    } else {
      const end = text.indexOf("\n", pos);
      snippet = Array.from(strip(text.slice(pos, end >= 0 ? end : text.length)));
      snippet = snippet.length > 20 ? snippet.slice(0, 20).join("") + "..." : snippet.join("");
    }
    return `${lineOf(text, pos)}번째 줄 — ${snippet}`;
  }
  function checkUserVariable(text, sections, config) {
    const items = [];
    const all = [...text.matchAll(/\{\{\s*user\s*\}\}/gi)];
    const exact = all.filter((m) => m[0] === "{{user}}");
    const variants = all.filter((m) => m[0] !== "{{user}}");
    let problems = 0;
    const braces = matchBraces(text);

    if (config["user_중첩_금지"] ?? true) {
      const userStarts = new Set([...exact, ...variants].map((m) => m.index));
      const nested = [], stack = [];
      for (const [pos, tok] of braces.tokens) {
        if (tok === "{{") {
          if (userStarts.has(pos) && stack.some((p) => braces.matched.has(p))) nested.push(lineOf(text, pos));
          stack.push(pos);
        } else if (stack.length) stack.pop();
      }
      if (nested.length) {
        problems++;
        items.push(item(FAIL, "다른 변수 안에 {{user}}가 들어가 있습니다", `${fmtLines(nested)} — 변수 안에 변수를 넣으면 치환이 깨집니다.`));
      }
    }
    if (config["user_헤더_금지"] ?? true) {
      const hl = [];
      splitlines(text).forEach((l, i) => { if (MD_HEADER.test(l) && /\{\{\s*user\s*\}\}/i.test(l)) hl.push(i + 1); });
      if (hl.length) { problems++; items.push(item(FAIL, "섹션 제목(헤더)에 {{user}}가 들어가 있습니다", fmtLines(hl))); }

  const TURN_TIME = /턴\s*(?:에|당|마다)\s*[^\n.]{0,12}?\d+\s*(?:~\s*\d+\s*)?(?:분|시간)/g;
  function checkTurnTime(text) {
    const hits = [...text.matchAll(TURN_TIME)].map((m) => lineOf(text, m.index));
    if (hits.length) return [item(WARN, "턴 단위 시간 표현이 있습니다", `${fmtLines(hits)} — '한 턴에 ○분' 대신 서술된 행동의 소요 시간대로 흐르게 써 주세요.`)];
    return [item(PASS, "턴 단위 시간 표현이 없습니다")];
  }

  function templateHeaders(config, templateText) {
    if (!config["템플릿_파일"] || !(config["템플릿_헤더_필수"] ?? true) || !templateText) return [];
    const sub = normalize(config["조연_항목"] || "\0");  // 조연은 없어도 됨
    return parseMdSections(templateText).map((s) => strip(s.name.replace(/\([^)]*\)/g, ""))).filter((n) => normalize(n) && normalize(n) !== sub);
  }
  function checkSections(res, config, templateText) {
    const items = [];
    if (!res.length) return [item(FAIL, "생성 결과에서 섹션 헤더를 하나도 찾지 못했습니다", "헤더는 '# 제목' 형태로 한 줄에 단독으로 적어 주세요.")];
    const required = [...(config["필수_섹션"] || []).map((n) => [n, "필수 섹션"]),
      ...templateHeaders(config, templateText).map((n) => [n, `템플릿(${config["템플릿_파일"]})`])];
    const seen = new Set();
    let missing = 0;
    for (const [name, source] of required) {
      if (seen.has(normalize(name))) continue;
      seen.add(normalize(name));
      if (!findSection(res, [name])) { missing++; items.push(item(FAIL, `'${name}' 섹션이 없습니다`, `기준: ${source}`)); }
    }
    if (required.length && missing === 0) items.push(item(PASS, `필수 섹션 ${seen.size}개가 모두 있습니다`, required.slice(0, 20).map(([n]) => n).join(", ")));
    if (config["원본_헤더_비교"] ?? true) items.push(item(INFO, "원본 설정에서 헤더를 찾지 못해 헤더 비교를 건너뜁니다"));
    return items;
  }

  /** PC판 run_mechanical_checks("", text, config) 와 같은 결과 */
  function runChecks(text, config, templateText) {
    if (!strip(text)) return [["기본 확인", [item(FAIL, "생성 결과 내용이 비어 있습니다", "검사할 생성 결과 파일을 먼저 불러와 주세요.")]]];
    const secs = parseMdSections(text);
    const groups = [
      ["글자 수 검사", checkLengths(secs, config)],
      ["{{user}} 위치 검사", checkUserVariable(text, secs, config)],
      ["필수 섹션 / 헤더 검사", checkSections(secs, config, templateText)],
    ];
    if (config["합계_제한"] && typeof config["합계_제한"] === "object") groups.push(["설정 크기 검사", checkTotalLength(secs, config)]);
    if (config["변수_검사"] && typeof config["변수_검사"] === "object") groups.push(["변수 검사", checkVariables(secs, config)]);
    if (config["카드_항목"]) groups.push(["등장인물 카드 검사", checkCards(secs, config, templateText)]);
    if (config["로어북_검사"] && typeof config["로어북_검사"] === "object") groups.push(["로어북 검사", checkLorebook(secs, config)]);
    if (config["턴_시간표현_금지"]) groups.push(["시간 표현 검사", checkTurnTime(text)]);
    return groups;
  }

  // ── 템플릿 양식 ──
  function headingKey(line) {
    let s = strip(line);
    if (!s || (startsWithAny(s, BULLETS) && !s.startsWith("#"))) return "";
    s = strip(s.replace(/^#+/, ""));
    const n = len(s);
    return n > 0 && n <= 60 ? normalize(s) : "";
  }
  const compact = (s) => s.replace(/\s/g, "");

  function parseTagBody(lines) {
    const values = {}, order = [], multi = new Set();
    let cur = null, buf = [], inline = "";
    const flush = () => {
      if (cur === null) return;
      if (!strip(inline) && buf.some((b) => strip(b))) multi.add(cur);
      values[cur] = strip([...(strip(inline) ? [strip(inline)] : []), ...buf].join("\n"));
    };
    for (const line of lines) {
      const m = line.match(VAR_TAG);
      if (m) { flush(); cur = strip(m[1]); inline = m[2]; buf = []; order.push(cur); }
      else if (cur !== null) buf.push(rstrip(line));
    }
    flush();
    return [values, order, multi];
  }

  function splitBlocks(lines, kind, groupTitles) {
    const groupKeys = new Map(groupTitles.map((g) => [normalize(g), g]));
    let heading = groupTitles[0] || "";
    const result = [];
    let head = null, body = [];
    const close = () => {
      if (!head) return;
      const [values, order, multi] = parseTagBody(body);
      let [group, name] = head;
      if (kind === "lore") group = heading;
      result.push([heading, { group, name, values }, order, multi]);
    };
    for (const line of lines) {
      const hk = headingKey(line);
      if (hk && groupKeys.has(hk) && !VAR_HEAD.test(line) && !LORE_HEAD.test(line)) {
        close(); head = null; body = []; heading = groupKeys.get(hk); continue;
      }
      const m = line.match(kind === "var" ? VAR_HEAD : LORE_HEAD);
      if (m) {
        close(); body = [];
        if (kind === "var") {
          const [name, sep, typ] = rpartition(strip(m[1]), "/");
          head = sep ? [strip(typ), strip(name)] : ["", strip(m[1])];
        } else head = ["", strip(m[2])];
        continue;
      }
      if (head) body.push(line);
    }
    close();
    return result;
  }

  function blockText(block, group, kind, number = 0) {
    const lines = [kind === "var"
      ? (block.group ? `[변수 이름] ${block.name} / ${block.group}` : `[변수 이름] ${block.name}`)
      : rstrip(`${number}. 트리거: ${block.name}`)];
    const tags = group ? [...group.tags] : [];
    for (const t of Object.keys(block.values)) if (!tags.includes(t)) tags.push(t);
    for (const tag of tags) {
      const value = block.values[tag] ?? "";
      if ((group && group.multiline.has(tag)) || value.includes("\n")) { lines.push(`[${tag}]`); if (value) lines.push(value); }
      else lines.push(rstrip(`[${tag}] ${value}`));
    }
    return lines;
  }

  function splitNotes(lines) {
    const body = [], notes = [];
    for (const l of lines) (strip(l).startsWith("※") ? notes : body).push(l);
    return [body, notes];
  }
  function proseFields(partTitle, sec, children) {
    const bodyLines = splitlines(sec.body);
    const fields = [];
    const first = children.length ? children[0].start - 1 - sec.start : bodyLines.length;
    const [introLines, introNotes] = splitNotes(bodyLines.slice(0, first));
    const intro = stripNL(introLines.join("\n"));
    if (strip(intro) || !children.length) fields.push({ part: partTitle, title: "", guide: intro, subHeads: [], notes: introNotes });
    for (const c of children) {
      const [lines, notes] = splitNotes(splitlines(c.body));
      const subs = lines.map((l) => l.match(MD_HEADER)).filter(Boolean).map((m) => strip(m[2]));
      fields.push({ part: partTitle, title: c.name, guide: rstrip(stripNL(lines.join("\n"))), subHeads: subs, notes });
    }
    for (const f of fields) { f.key = `${f.part}\u0000${f.title}`; f.label = f.title || `${f.part} 머리말`; }
    return fields;
  }

  function buildSchema(text, config) {
    const secs = parseMdSections(text);
    if (!secs.length) throw new Error("'# 제목' 으로 된 큰 항목이 없습니다.");
    const cardPart = normalize((config && config["카드_항목"]) || "");
    const subPart = normalize((config && config["조연_항목"]) || "");
    const topLevel = Math.min(...secs.map((s) => s.level));
    const parts = [], allNotes = [];
    for (const top of secs.filter((s) => s.level === topLevel)) {
      const inner = secs.filter((s) => s.level > topLevel && top.start <= s.start - 1 && s.start - 1 <= top.end);
      const childLevel = inner.length ? Math.min(...inner.map((s) => s.level)) : 0;
      const children = inner.filter((s) => s.level === childLevel);
      const [bodyLines, partNotes] = splitNotes(splitlines(top.body));
      allNotes.push(...partNotes);
      const nt = normalize(top.name);
      if (nt === normalize("변수") || nt === normalize("로어북")) {
        const kind = nt === normalize("변수") ? "var" : "lore";
        const titles = children.map((c) => c.name);
        const split = splitBlocks(bodyLines, kind, titles);
        const groups = new Map();
        for (const [heading, block, order, multi] of split) {
          const gkey = kind === "var" ? block.group : heading;
          let g = groups.get(gkey);
          if (!g) {
            g = { title: kind === "var" ? heading : gkey, kind: gkey, tags: [...order], multiline: new Set(multi), short: new Set(),
                  sample: blockText(block, null, kind, 1).join("\n") };
            groups.set(gkey, g);
          }
          multi.forEach((t) => g.multiline.add(t));
        }
        for (const g of groups.values())
          g.short = new Set(g.tags.filter((t) => !g.multiline.has(t)
            && split.filter(([, b]) => b.group === g.kind).every(([, b]) => len(b.values[t] ?? "") <= 30)));
        let ordered;
        if (kind === "lore") {
          for (const t of titles) if (!groups.has(t)) groups.set(t, { title: t, kind: t, tags: ["내용"], multiline: new Set(), short: new Set(), sample: "" });
          ordered = titles.map((t) => groups.get(t));
        } else ordered = [...groups.values()];
        parts.push({ title: top.name, kind, fields: [], groups: ordered, defaults: split.map(([, b]) => b), cardFields: [], cardTitle: "", notes: partNotes });
        continue;
      }
      if (subPart && nt === subPart && cardPart) {
        // 조연 카드: 칸 구성은 주연 카드와 같음 (아래에서 채움)
        parts.push({ title: top.name, kind: "cards", fields: [], groups: [], defaults: [], cardFields: [], cardTitle: `(${top.name} 이름)`, notes: partNotes, optional: true });
        continue;
      }
      if (cardPart && nt === cardPart && children.length) {
        const proto = children[0];
        const subs = inner.filter((s) => s.level > childLevel && proto.start <= s.start - 1 && s.start - 1 <= proto.end);
        const subLevel = subs.length ? Math.min(...subs.map((s) => s.level)) : 0;
        const cardFields = proseFields(top.name, proto, subs.filter((s) => s.level === subLevel));
        cardFields.forEach((f) => allNotes.push(...f.notes));
        const [, introNotes] = splitNotes(splitlines(top.body).slice(0, proto.start - 1 - top.start));
        parts.push({ title: top.name, kind: "cards", fields: [], groups: [], defaults: [], cardFields, cardTitle: proto.name, notes: introNotes });
        continue;
      }
      const fields = proseFields(top.name, top, children);
      fields.forEach((f) => allNotes.push(...f.notes));
      parts.push({ title: top.name, kind: "prose", fields, groups: [], defaults: [], cardFields: [], cardTitle: "", notes: [] });
    }
    const main = parts.find((p) => p.kind === "cards" && !p.optional);
    for (const p of parts) {
      if (!p.optional) continue;
      if (main) { p.cardFields = main.cardFields; continue; }
      const f = { part: p.title, title: "", guide: "", subHeads: [], notes: p.notes, key: `${p.title}\u0000`, label: `${p.title} 머리말` };
      Object.assign(p, { kind: "prose", fields: [f], notes: [] });
    }
    return { parts, lines: new Set(splitlines(text).map(strip).filter(Boolean)), noteLines: new Set(allNotes.map(strip).filter(Boolean)), text };
  }

  let cardUid = 0;
  const cardLabel = (card) => strip(card.name.replace(/\s*\(.*$/, "")) || strip(card.name) || "(이름 없음)";
  function defaultCard(part, name) {
    return { uid: ++cardUid, name: name == null ? part.cardTitle : name, sections: Object.fromEntries(part.cardFields.map((f) => [f.title, f.guide])) };
  }
  const cloneBlock = (b) => ({ group: b.group, name: b.name, values: { ...b.values } });
  function defaultForm(schema) {
    const prose = {}, blocks = {}, cards = {};
    for (const p of schema.parts) {
      for (const f of p.fields) prose[f.key] = f.guide;
      if (p.kind === "var" || p.kind === "lore") blocks[p.title] = p.defaults.map(cloneBlock);
      if (p.kind === "cards") cards[p.title] = p.optional ? [] : [defaultCard(p)];
    }
    return { prose, blocks, cards };
  }
  const groupOf = (part, block) => part.groups.find((g) => g.kind === block.group) || part.groups[0] || null;
  const cardFieldLabel = (card, f) => `${cardLabel(card)} › ${f.title || "머리말"}`;

  function assemble(schema, form, natural = false) {
    const out = [], owner = [];
    const add = (line, who) => { out.push(line); owner.push(who); };
    const head = (level, text) => (natural ? text : `${"#".repeat(level)} ${text}`);
    const addNotes = (notes, who) => { if (natural) for (const n of notes) add(n, who); };
    const addText = (text, who) => { text = rstrip(stripNL(text ?? "")); for (const line of text ? splitlines(text) : []) add(line, who); };
    for (const part of schema.parts) {
      if (out.length) add("", part.title);
      add(head(1, part.title), part.title);
      addNotes(part.notes || [], part.title);
      if (part.kind === "prose") {
        for (const f of part.fields) {
          if (f.title) { add("", f.label); add(head(2, f.title), f.label); }
          addText(form.prose[f.key], f.label);
          addNotes(f.notes, f.label);
        }
        continue;
      }
      if (part.kind === "cards") {
        for (const card of (form.cards && form.cards[part.title]) || []) {
          const who = cardLabel(card);
          add("", who);
          const name = strip(card.name) || part.cardTitle;
          add(natural ? `■ ${part.optional ? part.title : "캐릭터"}: ${name}` : `## ${name}`, who);
          for (const f of part.cardFields) {
            const label = cardFieldLabel(card, f);
            if (f.title) { add("", label); add(head(3, f.title), label); }
            addText(card.sections[f.title], label);
            addNotes(f.notes, label);
          }
        }
        continue;
      }
      let number = 0;
      const blocks = form.blocks[part.title] || [];
      for (const g of part.groups) {
        add("", part.title); add(head(2, g.title), part.title);
        for (const b of blocks.filter((b) => groupOf(part, b) === g)) {
          number++;
          const who = part.kind === "var" ? `변수 '${b.name}'` : `${part.title} ${number}번 '${b.name}'`;
          add("", who);
          for (const line of splitlines(blockText(b, g, part.kind, number).join("\n"))) add(line, who);
        }
      }
    }
    return [rstrip(out.join("\n")) + "\n", owner];
  }

  function buildSourceForm(schema) {
    const [text] = assemble(schema, defaultForm(schema), true);
    const lines = splitlines(text).map((l) => { const m = l.match(MD_HEADER); return m ? strip(m[2]) : l; });
    const note = schema.parts.some((p) => p.kind === "cards") ? SOURCE_FORM_NOTE_CARDS : SOURCE_FORM_NOTE;
    return [...note, "", ...lines].join("\n") + "\n";
  }

  function restoreSubHeads(text, subHeads) {
    let keys = subHeads.map((h) => compact(h.replace(/\([^)]*\)/g, "")));
    const freeHeads = keys.some((k) => !k);
    keys = keys.filter(Boolean);
    if (!keys.length && !freeHeads) return text;
    return splitlines(text).map((line) => {
      const s = strip(line);
      if (s && !startsWithAny(s, ["#", ...BULLETS]) && len(s) <= 60) {
        if (keys.some((k) => compact(s).startsWith(k))
          || (freeHeads && len(s) <= 30 && ![".", "다", "요", ":"].some((e) => s.endsWith(e)))) return `### ${s}`;
      }
      return line;
    }).join("\n");
  }

  function fillFromText(schema, text, config) {
    const form = defaultForm(schema);
    const partKeys = new Map();
    for (const p of schema.parts) for (const a of fieldAliases(p.title, config)) if (!partKeys.has(normalize(a))) partKeys.set(normalize(a), p);
    let cur = null, skipping = false, field = null, cardSub = null;
    const seen = new Set(), buf = new Map(), raw = new Map(), cards = new Map(), unplaced = [], notes = [];
    for (const line of splitlines(text)) {
      if ((schema.noteLines.size && schema.noteLines.has(strip(line))) || SOURCE_FORM_NOTE_CARDS.includes(strip(line))) continue;
      const hk = headingKey(line);
      const headM = line.match(CARD_HEAD);
      if (headM) {
        // '■ 캐릭터:' 줄은 어디에 있든 카드의 시작이므로 카드 항목으로 넘어갑니다 ('■ 조연:' 은 조연 항목)
        const wantSub = headM[1] === "조연";
        const cardPart = schema.parts.find((p) => p.kind === "cards" && Boolean(p.optional) === wantSub);
        if (cardPart && cardPart !== cur) { cur = cardPart; skipping = false; field = null; cardSub = null; seen.add(cur.title); }
      }
      if (hk && partKeys.has(hk)) {
        cur = partKeys.get(hk);
        skipping = seen.has(cur.title) && cur.kind !== "cards";
        if (skipping) notes.push(`'${cur.title}' 항목이 두 번 이상 나옵니다. 한 벌만 다루므로 두 번째부터는 넣지 않았습니다.`);
        seen.add(cur.title);
        field = cur.fields.find((f) => !f.title) || null;
        cardSub = null;
        continue;
      }
      if (!cur || skipping) { if (strip(line) && !strip(line).startsWith("※")) unplaced.push(line); continue; }
      if (cur.kind === "cards") {
        const md = line.match(MD_HEADER), nat = line.match(CARD_HEAD);
        const sub = cur.cardFields.find((f) => f.title && hk && normalize(f.title) === hk);
        if (!cards.has(cur.title)) cards.set(cur.title, []);
        const list = cards.get(cur.title);
        if ((md && md[1].length === 2) || nat) {
          list.push([strip(nat ? nat[2] : md[2]), new Map()]);
          cardSub = cur.cardFields.find((f) => !f.title) ? "" : null;
          continue;
        }
        if (sub) {
          if (!list.length) list.push(["", new Map()]);
          cardSub = sub.title;
          const secs = list[list.length - 1][1];
          if (!secs.has(cardSub)) secs.set(cardSub, []);
          continue;
        }
        if (!list.length || cardSub === null) { if (strip(line)) unplaced.push(line); continue; }
        const secs = list[list.length - 1][1];
        if (!secs.has(cardSub)) secs.set(cardSub, []);
        secs.get(cardSub).push(line);
        continue;
      }
      if (cur.kind !== "prose") { if (!raw.has(cur.title)) raw.set(cur.title, []); raw.get(cur.title).push(line); continue; }
      const match = cur.fields.find((f) => f.title && hk && normalize(f.title) === hk);
      if (match) { field = match; if (!buf.has(field.key)) buf.set(field.key, []); continue; }
      if (!field) { if (strip(line)) unplaced.push(line); continue; }
      if (!buf.has(field.key)) buf.set(field.key, []);
      buf.get(field.key).push(line);
    }
    const filled = [];
    for (const p of schema.parts) {
      for (const f of p.fields) if (buf.has(f.key)) {
        form.prose[f.key] = restoreSubHeads(rstrip(stripNL(buf.get(f.key).join("\n"))), f.subHeads);
        filled.push(f.label);
      }
      if ((p.kind === "var" || p.kind === "lore") && raw.has(p.title)) {
        const blocks = splitBlocks(raw.get(p.title), p.kind, p.groups.map((g) => g.title)).map(([, b]) => b);
        if (blocks.length) { form.blocks[p.title] = blocks; filled.push(`${p.title} ${blocks.length}개`); }
      }
      if (p.kind === "cards" && (cards.get(p.title) || []).length) {
        const parsed = cards.get(p.title).map(([name, secs]) => {
          const card = defaultCard(p, name);
          for (const f of p.cardFields) if (secs.has(f.title)) card.sections[f.title] = restoreSubHeads(rstrip(stripNL(secs.get(f.title).join("\n"))), f.subHeads);
          return card;
        });
        form.cards[p.title] = parsed;
        filled.push(`${p.title} 카드 ${parsed.length}장`);
      }
    }
    return { form, filled, unplaced, notes: [...new Set(notes)] };
  }

  function isPlaceholderLine(line, next) {
    let s = strip(line);
    s = strip(s.replace(/^#+/, ""));
    while (s && BULLETS.includes(s[0])) s = s.slice(1);
    s = strip(s);
    if (!s) return false;
    if (s.endsWith(":") && (next.startsWith(" ") || next.startsWith("\t"))) return false;
    return [":", "=", "!"].some((e) => s.endsWith(e)) || s.includes(": /") || s.includes("= /") || s.startsWith("(")
      || /[:\]]\s*\(/.test(s) || (s.endsWith(")") && s.includes("(") && len(s) <= 40)
      || /^\d+\.\s*트리거:\s*!?$/.test(s);
  }

  function checkForm(schema, form, text, owner) {
    const items = [];
    const empty = [];
    for (const p of schema.parts) for (const f of p.fields) if (!strip(form.prose[f.key] ?? "")) empty.push(f.label);
    for (const p of schema.parts) if (p.kind === "cards") {
      const cards = (form.cards && form.cards[p.title]) || [];
      if (!cards.length && !p.optional) items.push(item(WARN, `'${p.title}' 카드가 한 장도 없습니다`, "카드를 추가해 주세요."));
      for (const card of cards) for (const f of p.cardFields) if (!strip(card.sections[f.title] ?? "")) empty.push(cardFieldLabel(card, f));
    }
    if (empty.length) items.push(item(WARN, `비어 있는 칸이 ${empty.length}개 있습니다`, empty.join(", ")));
    const lines = splitlines(text);
    const left = new Map();
    lines.forEach((line, i) => {
      const next = i + 1 < lines.length ? lines[i + 1] : "";
      if (schema.lines.has(strip(line)) && isPlaceholderLine(line, next)) {
        const who = owner[i] ?? "?";
        if (!left.has(who)) left.set(who, []);

      const detail = [...left].map(([who, rows]) => `· ${who}: ${Array.from(rows[0]).slice(0, 30).join("")}` + (rows.length > 1 ? ` 외 ${rows.length - 1}줄` : "")).join("\n");
      items.push(Object.assign(item(WARN, `아직 채우지 않은 템플릿 안내 문구가 ${total}줄 있습니다`, detail), { left }));
    }
    return items;
  }

  function labelLineNumbers(detail, owner) {
    return detail.replace(/((?:\d+, )*\d+)번째 줄/g, (m0, g1) => {
      const whos = [...new Set(g1.match(/\d+/g).map(Number).filter((n) => n > 0 && n <= owner.length).map((n) => owner[n - 1]))];
      return whos.length ? whos.map((w) => `'${w}'`).join(", ") + " 칸" : m0;
    });
  }

  return { PASS, WARN, FAIL, INFO, len, fmt, recommendedLine, normalize, splitlines, parseMdSections, matchingSections, countChars, fieldAliases,

<script>
(() => {
  const E = Engine;

  const MODES = Object.keys(BUILTIN);
  const MODE_KEY = "melloy-writer:mode";
  // 배포본은 주소마다 앱이 다릅니다. ""(작성기.html 을 그냥 열었을 때)이면 시작 화면에서 둘 다 고를 수 있습니다.
  const APP = window.CHARAMEKA_APP === "html" || window.CHARAMEKA_APP === "writer" ? window.CHARAMEKA_APP : "";
  const OTHER = APP === "html" ? { url: "../writer/", label: "경량봇 작성기 열기", sub: "경량 코어 시트 칸 작성·점검·내보내기" }
    : APP === "writer" ? { url: "../html/", label: "HTML 미리보기 열기", sub: "상태창·소개문 HTML을 붙여넣어 확인합니다." } : null;
  const firstView = () => ({ kind: APP === "html" ? "preview" : APP === "writer" ? "home" : "start" });
  // 1인 모드는 예전 저장 이름을 그대로 써서, 이미 쓰던 작업이 이어집니다.
  const modeKey = (base) => (S.mode === "1인" ? base : `${base}:${S.mode}`);
  const STORE = () => modeKey("melloy-writer:v1"), BACKUP = () => modeKey("melloy-writer:backup"), RULES = () => modeKey("melloy-writer:rules");

  // ── 저장소 (막혀 있어도 페이지는 동작) ──
  const store = {
    get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // ── 상태 ──
  const S = { mode: "1인", rules: null, schema: null, form: null, view: { kind: "home" }, text: "", owner: [], issues: [], left: new Map(),
              empty: new Set(), savedAt: null, saveOk: true, source: null };

  function loadRules() {
    const custom = store.get(RULES());
    const base = BUILTIN[S.mode] || BUILTIN[MODES[0]];
    S.rules = { template: custom?.template || base.template, config: custom?.config || base.config,
                custom: Boolean(custom), templateName: custom?.templateName || "", configName: custom?.configName || "" };
    S.schema = E.buildSchema(S.rules.template, S.rules.config);
  }
  const cardParts = () => S.schema.parts.filter((p) => p.kind === "cards");
  function serialForm(form) { return { prose: form.prose, blocks: form.blocks, cards: form.cards }; }
  /** 저장해 둔 작업을 지금 양식 위에 얹습니다. (카드는 새 번호를 붙여 다시 만듭니다) */
  function formFromSaved(saved) {
    const form = E.defaultForm(S.schema);
    Object.assign(form.prose, saved.prose);
    for (const k of Object.keys(form.blocks)) if (Array.isArray(saved.blocks?.[k])) form.blocks[k] = saved.blocks[k];
    for (const p of cardParts()) if (Array.isArray(saved.cards?.[p.title]))
      form.cards[p.title] = saved.cards[p.title].map((c) => Object.assign(E.defaultCard(p, c.name ?? ""), { sections: { ...E.defaultCard(p).sections, ...(c.sections || {}) } }));
    return form;
  }
  function validForm(f) { return f && typeof f.prose === "object" && typeof f.blocks === "object"; }

  // ── 도구 ──
  const $ = (id) => document.getElementById(id);
  function h(tag, props = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k in el && typeof v !== "string") el[k] = v;

  const hhmm = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const stamp = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}_${hhmm(d).replace(":", "")}`;

  const realCards = () => cardParts().filter((p) => !p.optional).flatMap((p) => (S.form.cards[p.title] || []).map((c) => E.cardLabel(c)))
    .filter((n) => n && !n.startsWith("(") && n !== "(이름 없음)");
  function charName() {
    if (cardParts().length) {
      const names = realCards();
      return names.length ? names.join(" · ") : "";
    }
    for (const p of S.schema.parts) for (const f of p.fields) if (!f.title) {
      const m = (S.form.prose[f.key] || "").match(/\[([^\]\n]+?)\s+CHARACTER PROFILE\]/i);
      if (m && m[1].trim() && m[1].trim() !== "캐릭터명") return m[1].trim();
    }
    return "";
  }

  // ── 이동 대상 ──
  function targets() {
    const list = [];
    for (const p of S.schema.parts) {
      if (p.kind === "prose") p.fields.forEach((f) => list.push({ kind: "field", key: f.key, label: f.label, part: p.title }));
      else if (p.kind === "cards") (S.form.cards[p.title] || []).forEach((c) => list.push({ kind: "card", part: p.title, uid: c.uid, label: E.cardLabel(c) }));
      else list.push({ kind: "blocks", part: p.title, label: p.title });
    }
    return list;
  }
  function targetOfOwner(who) {
    for (const p of S.schema.parts) {
      if (p.kind === "prose") {
        const f = p.fields.find((x) => x.label === who);
        if (f) return { kind: "field", key: f.key };
        if (who === p.title && p.fields[0]) return { kind: "field", key: p.fields[0].key };
      } else if (p.kind === "cards") {
        const c = (S.form.cards[p.title] || []).find((c) => who === E.cardLabel(c) || who.startsWith(E.cardLabel(c) + " › "));
        if (c) return { kind: "card", part: p.title, uid: c.uid };
      } else if (who === p.title || who.startsWith(p.title + " ") || (p.kind === "var" && who.startsWith("변수 "))) {
        return { kind: "blocks", part: p.title };
      }
    }
    return null;
  }
  const sameTarget = (a, b) => a && b && a.kind === b.kind
    && (a.kind === "field" ? a.key === b.key : a.kind === "card" ? a.uid === b.uid : a.part === b.part);
  const findCard = (t) => (S.form.cards[t.part] || []).find((c) => c.uid === t.uid);

  // ── 계산 ──
  function recompute() {
    [S.text, S.owner] = E.assemble(S.schema, S.form);
    const cfg = S.rules.config;
    const raw = E.runChecks(S.text, cfg, S.rules.template).flatMap(([, items]) => items).filter((i) => i.status === E.WARN || i.status === E.FAIL);
    const formItems = E.checkForm(S.schema, S.form, S.text, S.owner);
    S.left = formItems.find((i) => i.left)?.left || new Map();
    S.empty = new Set();
    for (const p of S.schema.parts) for (const f of p.fields) if (!(S.form.prose[f.key] || "").trim()) S.empty.add(f.label);
    for (const p of cardParts()) for (const c of S.form.cards[p.title] || [])
      for (const f of p.cardFields) if (!(c.sections[f.title] || "").trim()) S.empty.add(E.cardFieldLabel(c, f));
    S.cardSizes = new Map();
    if (cfg["카드_항목"]) {
      const secs = E.parseMdSections(S.text);
      for (const p of cardParts()) {
        const sizes = E.cardSections(secs, cfg, p.title)[1].map((c) => E.countChars(c.body, true));
        (S.form.cards[p.title] || []).forEach((c, i) => S.cardSizes.set(c.uid, sizes[i] ?? 0));
      }
    }
    S.issues = [...raw, ...formItems].map((i) => {
      const owners = new Set();
      for (const m of i.detail.matchAll(/((?:\d+, )*\d+)번째 줄/g))
        for (const n of m[1].match(/\d+/g).map(Number)) if (n > 0 && n <= S.owner.length) owners.add(S.owner[n - 1]);
      if (i.left) for (const who of i.left.keys()) owners.add(who);
      return { ...i, detail: E.labelLineNumbers(i.detail, S.owner), owners: [...owners] };
    }).sort((a, b) => (a.status === E.FAIL ? 0 : 1) - (b.status === E.FAIL ? 0 : 1));
  }
  function statusOf(t) {
    let st = "ok";
    for (const i of S.issues) {
      if (!i.owners.some((who) => sameTarget(targetOfOwner(who), t))) continue;
      if (i.left && t.kind === "field") continue;  // 남은 안내 문구는 아래에서 따로 셈
      if (i.status === E.FAIL) return "fail";
      st = "warn";
    }
    if (t.kind === "field") {
      const f = S.schema.parts.flatMap((p) => p.fields).find((x) => x.key === t.key);
      if (S.empty.has(f.label)) return "empty";
      if (S.left.has(f.label)) return "warn";
    }
    if (t.kind === "card") {
      const p = S.schema.parts.find((x) => x.title === t.part), c = findCard(t);
      if (c) {
        const labels = p.cardFields.map((f) => E.cardFieldLabel(c, f));
        if (labels.every((l) => S.empty.has(l))) return "empty";
        if (st === "ok" && labels.some((l) => S.empty.has(l) || S.left.has(l))) return "warn";
      }

  }

  // ── 저장 ──
  let saveTimer = null, checkTimer = null;
  function changed() {

  }
  function save() {

    if (S.saveOk) S.savedAt = now();

  }
  function replaceForm(form, source, message) {
    const prev = store.get(STORE());
    if (prev) store.set(BACKUP(), prev);
    S.form = form; S.source = source || null;
    save(); recompute(); go({ kind: "home" });
    if (message !== false) toast(message || "바꿨습니다.", prev ? { label: "되돌리기", run: restoreBackup } : null);
  }
  function loadDraft() {
    const saved = store.get(STORE());
    if (saved && validForm(saved.form)) {

      S.source = saved.source || null;
      S.savedAt = saved.savedAt ? new Date(saved.savedAt) : null;
    } else {
      S.form = E.defaultForm(S.schema);
      S.source = null; S.savedAt = null;
    }
  }
  function switchMode(mode) {
    if (mode === S.mode || !MODES.includes(mode)) return;
    clearTimeout(saveTimer); save();          // 지금 모드의 작업을 먼저 저장
    S.mode = mode;

    const cur = store.get(STORE());
    S.form = formFromSaved(b.form); S.source = b.source || null;

  }

  // ── 화면: 목차 ──
  function renderDraftMeta() {
    const el = $("draft-meta");
    if (!el) return;

      h("span", { text: S.saveOk ? (S.savedAt ? `이 기기에 자동 저장됨 · ${hhmm(S.savedAt)}` : "이 기기에 자동 저장됩니다") : "자동 저장이 막혀 있습니다. 내보내기로 따로 보관하세요." }),
      h("span", { text: `${S.mode} 모드 · ` + (S.rules.custom ? "내가 바꾼 규칙 사용 중" : "기본 규칙 사용 중") }));
  }
  function renderNav() {
    const nav = $("nav");
    const name = charName();
    const kids = [
      h("div", { class: "draft" },
        h("p", { class: "draft-name", text: name || (cardParts().length ? "이름 없는 작품" : "이름 없는 캐릭터") }),
        MODES.length > 1 ? h("button", { class: "mode-pill", type: "button", onclick: openModes, text: `${S.mode} 모드 · 바꾸기` }) : null,

        h("button", { class: "btn", type: "button", onclick: () => $("file-source").click(), text: "파일 불러오기" }),

      const list = h("ul", { class: "items" });
      const add = (t, label, sub) => {
        const st = statusOf(t);

          onclick: () => go(t) },

          h("span", { class: "name" }, label, h("span", { class: "sub", text: sub })),

      };

        (S.form.cards[p.title] || []).forEach((c) => {
          const t = { kind: "card", part: p.title, uid: c.uid };

          const sub = st === "empty" ? "비어 있음" : st === "fail" ? "고칠 곳 있음" : left ? `안내 문구 ${left}줄 남음` : "";

        });

          h("span", { class: "dot", "aria-hidden": "true" }),

            p.optional && !(S.form.cards[p.title] || []).length ? h("span", { class: "sub", text: "없으면 비워 두세요" }) : null),
          h("span"))));

        add(t, f.label, sub);
      });

        list.lastChild.querySelector(".tnum").textContent = `${n}개`;

  }

  // ── 설정 크기 (MELLOY 표시처럼 세계관 / 주연 / 조연 / 로어북) ──
  function sizeBox() {
    const cfg = S.rules.config;

    const t = E.checkTotalLength(E.parseMdSections(S.text), cfg)[0];
    const state = t.status === E.FAIL ? "fail" : t.status === E.WARN ? "warn" : "";
    const rows = t.sizes.map((p) => {
      const extra = [p.note, p.actual > p.used ? `실제 ${fmt(p.actual)}` : ""].filter(Boolean).join(" · ");
      return h("li", {}, h("span", {}, p.label, extra ? h("small", { text: extra }) : null), h("span", { class: "tnum", text: fmt(p.used) }));
    });
    return h("section", { class: `size-box ${state}`, "aria-label": "설정 크기" },
      h("div", { class: "size-head" }, h("span", { text: "설정 크기" }),
        h("span", { class: "tnum" }, h("b", { text: `${fmt(t.total)}자` }))),
      t.tokens ? h("p", { class: "size-tokens", text: `${t.tokens} (추정)` }) : null,
      h("ul", { class: "size-rows" }, ...rows),
      h("p", { class: "size-foot", text: `권장 ${fmt(t.recommended)}자 · 최대 ${fmt(t.maximum)}자` }));
  }

  // ── 카드 관리 ──
  function addCard(p) {
    const c = E.defaultCard(p);
    (S.form.cards[p.title] = S.form.cards[p.title] || []).push(c);
    changed(); recompute(); go({ kind: "card", part: p.title, uid: c.uid });

  }
  function moveCard(p, c, step) {
    const cards = S.form.cards[p.title], i = cards.indexOf(c), j = i + step;
    if (j < 0 || j >= cards.length) return;
    [cards[i], cards[j]] = [cards[j], cards[i]];
    changed(); recompute(); go({ kind: "card", part: p.title, uid: c.uid });
  }
  function deleteCard(p, c) {
    S.form.cards[p.title].splice(S.form.cards[p.title].indexOf(c), 1);
    changed(); recompute(); go({ kind: "home" }); toast(`'${E.cardLabel(c)}' 카드를 지웠습니다.`);
  }

  // ── 화면: 칸 편집 ──
  function renderEditor() {
    const ed = $("editor");
    const v = S.view;
    if (v.kind === "start") { renderStart(ed); return; }
    if (v.kind === "preview") { renderPreview(ed); return; }
    if (v.kind === "home") {
      ed.replaceChildren(h("div", { class: "ed-head" },
        h("span", { class: "ed-crumb", text: "시작하기" }),
        h("h2", { class: "ed-title", text: "왼쪽 목록에서 칸을 고르세요" })),
        h("p", { class: "muted", text: "칸마다 자연어로 쓰면, 내보낼 때 템플릿 양식(# 제목, [변수 이름], N. 트리거:)이 자동으로 붙습니다." }));

    const list = targets();
    const idx = list.findIndex((t) => sameTarget(t, v));
    const pager = h("div", { class: "pager" },
      h("button", { class: "btn quiet", type: "button", disabled: idx <= 0, onclick: () => go(list[idx - 1]), text: "‹ 이전 칸" }),
      h("button", { class: "btn quiet", type: "button", disabled: idx >= list.length - 1, onclick: () => go(list[idx + 1]), text: "다음 칸 ›" }));
    if (v.kind === "field") {
      const f = S.schema.parts.flatMap((p) => p.fields).find((x) => x.key === v.key);
      const count = h("span", { class: "tnum" });
      const upd = () => { count.textContent = `${fmt(E.len(ta.value.trim()))}자`; };
      const ta = h("textarea", { class: "field", id: "field-" + encodeURIComponent(f.key), spellcheck: false, "aria-label": f.label,
        oninput: () => { S.form.prose[f.key] = ta.value; upd(); changed(); } });
      ta.value = S.form.prose[f.key] ?? "";
      upd();
      ed.replaceChildren(
        h("div", { class: "ed-head" }, h("span", { class: "ed-crumb", text: f.part }), h("h2", { class: "ed-title", text: f.label })),
        f.guide ? h("details", { class: "guide" }, h("summary", { text: "템플릿 안내 보기" }), h("pre", { text: f.guide })) : null,
        ta, h("div", { class: "ed-foot" }, count, pager));
      return;
    }
    if (v.kind === "card") {
      const part = S.schema.parts.find((p) => p.title === v.part), c = findCard(v);
      if (!c) { go({ kind: "home" }); return; }
      const cards = S.form.cards[part.title], i = cards.indexOf(c);
      const limit = Math.trunc(Number(S.rules.config["카드_글자수"]?.["최대"] ?? 5000));
      const [goal, goalName] = E.recommendedLine({ "최대": limit, ...(S.rules.config["카드_글자수"] || {}) }, S.rules.config);
      const size = h("span", { class: "tnum" });
      const updSize = () => {
        const n = S.cardSizes.get(c.uid) || 0;
        size.textContent = `카드 ${fmt(n)} / ${fmt(limit)}자` + ` (${goalName} ${fmt(goal)})`;
        size.style.color = n > limit ? "var(--fail)" : goal && n > goal ? "var(--warn)" : "";
      };
      updSize();
      S.onRecompute = updSize;
      const title = h("h2", { class: "ed-title", text: E.cardLabel(c) });
      const nameInput = h("input", { class: "input", id: `card-${c.uid}-name`, value: c.name, placeholder: "이름 (한자 / 로마자)",
        oninput: () => { c.name = nameInput.value.trim(); title.textContent = E.cardLabel(c); $("top-title").textContent = E.cardLabel(c); changed(); } });
      const actions = h("div", { class: "card-actions" });
      const delBtn = h("button", { class: "btn quiet", type: "button", text: "카드 지우기", onclick: () => actions.replaceChildren(h("div", { class: "confirm-row" },
        h("span", { text: `'${E.cardLabel(c)}' 카드를 내용째 지울까요?` }),
        h("button", { class: "btn danger", type: "button", text: "지우기", onclick: () => deleteCard(part, c) }),
        h("button", { class: "btn quiet", type: "button", text: "취소", onclick: () => renderEditor() }))) });
      actions.append(
        h("button", { class: "btn quiet", type: "button", text: "▲ 앞으로", disabled: i <= 0, onclick: () => moveCard(part, c, -1) }),
        h("button", { class: "btn quiet", type: "button", text: "▼ 뒤로", disabled: i >= cards.length - 1, onclick: () => moveCard(part, c, 1) }),
        delBtn);
      const kids = [h("div", { class: "ed-head" }, h("span", { class: "ed-crumb", text: `${part.title} · ${i + 1}/${cards.length}` }), title),
        h("label", { class: "tag" }, h("span", { class: "tag-name" }, "카드 이름", size), nameInput),
        part.notes.length ? h("details", { class: "guide" }, h("summary", { text: "카드 작성 메모" }), h("pre", { text: part.notes.map((n) => n.trim()).join("\n") })) : null];
      for (const f of part.cardFields) {
        const cnt = h("span", { class: "tnum" });
        const area = h("textarea", { class: "area tall", id: `card-${c.uid}-${f.title}`, spellcheck: false, "aria-label": f.title });
        area.value = c.sections[f.title] ?? "";
        const upd = () => { cnt.textContent = `${fmt(E.len(area.value.trim()))}자`; };
        area.addEventListener("input", () => { c.sections[f.title] = area.value; upd(); changed(); });
        upd();
        const guide = [f.guide, f.notes.map((n) => n.trim()).join("\n")].filter(Boolean).join("\n\n");
        kids.push(h("section", { class: "card-sec" },
          h("div", { class: "tag-name" }, h("b", { text: f.title || "머리말" }), cnt),
          guide ? h("details", { class: "guide" }, h("summary", { text: "템플릿 안내 보기" }), h("pre", { text: guide })) : null,
          area));
      }
      kids.push(actions, h("div", { class: "ed-foot" }, h("span"), pager));
      ed.replaceChildren(...kids);
      return;
    }
    const part = S.schema.part ? S.schema.part(v.part) : S.schema.parts.find((p) => p.title === v.part);
    const blocks = S.form.blocks[part.title] || (S.form.blocks[part.title] = []);
    const limit = Math.trunc(Number(S.rules.config["변수_검사"]?.["변수_내용_최대"] ?? 200));
    const kids = [h("div", { class: "ed-head" }, h("span", { class: "ed-crumb", text: "구조 칸" }), h("h2", { class: "ed-title", text: part.title })),
      h("p", { class: "muted", text: part.kind === "var" ? "[변수 이름] 이름 / 종류, [태그] 표시는 내보낼 때 자동으로 붙습니다." : "'N. 트리거:' 번호와 [태그] 표시는 내보낼 때 자동으로 붙습니다." })];
    for (const g of part.groups) {
      kids.push(h("h3", { class: "group-title", text: g.title }));
      blocks.filter((b) => E.groupOf(part, b) === g).forEach((b) => kids.push(blockCard(part, g, b, limit)));
      kids.push(h("div", {}, h("button", { class: "btn", type: "button", text: `+ ${g.title} 추가`, onclick: () => {
        const nb = { group: g.kind, name: "", values: Object.fromEntries(g.tags.map((t) => [t, ""])) };
        const last = blocks.map((b) => E.groupOf(part, b) === g).lastIndexOf(true);
        blocks.splice(last < 0 ? blocks.length : last + 1, 0, nb);
        changed(); renderEditor();
        const cards = $("editor").querySelectorAll(".card input");
        toast(`${g.title}을(를) 추가했습니다.`);
        cards.length && cards[[...cards].findIndex((c) => c.dataset.block === String(blocks.indexOf(nb)))]?.focus();
      } })));
    }
    kids.push(h("div", { class: "ed-foot" }, h("span"), pager));
    ed.replaceChildren(...kids);
  }

  function blockCard(part, g, b, limit) {
    const blocks = S.form.blocks[part.title];
    const bi = String(blocks.indexOf(b));
    const nameInput = h("input", { class: "input", id: `blk-${part.title}-${bi}-name`, value: b.name, "data-block": bi,
      placeholder: part.kind === "var" ? "공백 없이 (예: 최근사건)" : "예: !요약",
      oninput: () => { b.name = nameInput.value.trim(); changed(); } });
    const head = [h("label", { class: "tag" }, h("span", { class: "tag-name", text: part.kind === "var" ? "변수 이름" : "트리거" }), nameInput)];
    if (part.kind === "var") {
      const kinds = part.groups.map((x) => x.kind);
      if (!kinds.includes(b.group)) kinds.push(b.group);
      const sel = h("select", { class: "input", id: `blk-${part.title}-${bi}-kind`, "aria-label": "종류",
        onchange: () => { b.group = sel.value; changed(); renderEditor(); } }, kinds.map((k) => h("option", { value: k, text: k || "(없음)" })));
      sel.value = b.group;
      head.push(h("label", { class: "tag" }, h("span", { class: "tag-name", text: "종류" }), sel));
    }
    const tags = [...g.tags, ...Object.keys(b.values).filter((t) => !g.tags.includes(t))];
    const fields = tags.map((tag) => {
      const val = b.values[tag] ?? "";
      const id = `blk-${part.title}-${bi}-${tag}`;
      if (g.short.has(tag) && !val.includes("\n")) {
        const inp = h("input", { class: "input", id, value: val, oninput: () => { b.values[tag] = inp.value; changed(); } });
        return h("label", { class: "tag" }, h("span", { class: "tag-name", text: `[${tag}]` }), inp);
      }
      const cnt = h("span", { class: "tnum" });
      const area = h("textarea", { class: "area", id, spellcheck: false, rows: g.multiline.has(tag) ? 5 : 3 });
      area.value = val;
      const upd = () => {
        const rows = area.value.split("\n");
        const n = tag === "구간별 행동" ? Math.max(0, ...rows.map((r) => E.len(r.trim()))) : E.len(area.value.trim());
        cnt.textContent = (tag === "구간별 행동" ? "한 줄 최대 " : "") + `${fmt(n)}자`;
        cnt.className = "tnum" + (part.kind === "var" && n > limit ? " over" : "");
      };
      area.addEventListener("input", () => { b.values[tag] = area.value; upd(); changed(); });
      upd();
      return h("label", { class: "tag" }, h("span", { class: "tag-name" }, `[${tag}]`, cnt), area);
    });
    const actions = h("div", { class: "card-actions" });
    const askDelete = () => actions.replaceChildren(h("div", { class: "confirm-row" },
      h("span", { text: `'${b.name || "이름 없음"}'을(를) 지울까요?` }),
      h("button", { class: "btn danger", type: "button", text: "지우기", onclick: () => {
        blocks.splice(blocks.indexOf(b), 1); changed(); renderEditor(); toast("지웠습니다."); } }),
      h("button", { class: "btn quiet", type: "button", text: "취소", onclick: () => actions.replaceChildren(delBtn) })));
    const delBtn = h("button", { class: "btn quiet", type: "button", text: "지우기", onclick: askDelete });
    actions.append(delBtn);
    return h("div", { class: "card" }, h("div", { class: part.kind === "var" ? "card-head" : "" }, ...head), ...fields, actions);
  }

  // ── 아래 계기판 ──
  function renderMeters() {
    const cfg = S.rules.config, secs = E.parseMdSections(S.text);
    const meters = [];
    for (const rule of cfg["글자수_제한"] || []) {
      const field = rule["필드"] ?? "?", limit = Math.trunc(Number(rule["최대"] ?? 0));
      const n = E.matchingSections(secs, [field, ...(rule["별칭"] || [])]).reduce((a, s) => a + E.countChars(s.body, true), 0);
      const [rec] = E.recommendedLine(rule, cfg);
      meters.push({ label: field, n, max: limit, mark: rec, state: n > limit ? "fail" : n > rec ? "warn" : "" });
    }
    if (cfg["카드_항목"]) {
      const rule = { "최대": 5000, ...(cfg["카드_글자수"] || {}) };
      const limit = Math.trunc(Number(rule["최대"])), [goal] = E.recommendedLine(rule, cfg);
      const all = [...E.cardSections(secs, cfg)[1], ...(cfg["조연_항목"] ? E.cardSections(secs, cfg, cfg["조연_항목"])[1] : [])];
      const n = Math.max(0, ...all.map((c) => E.countChars(c.body, true)));
      meters.push({ label: "가장 긴 카드", n, max: limit, mark: goal, state: n > limit ? "fail" : n > goal ? "warn" : "" });
    }
    if (cfg["합계_제한"] && typeof cfg["합계_제한"] === "object") {
      const t = E.checkTotalLength(secs, cfg)[0];
      meters.push({ label: "설정 크기", n: t.total, max: t.maximum, mark: t.recommended, state: t.status === E.FAIL ? "fail" : t.status === E.WARN ? "warn" : "" });
    }
    $("meters").replaceChildren(...meters.slice(0, 3).map((m) => h("div", { class: `meter ${m.state}` },
      h("div", { class: "meter-label" }, h("span", { text: m.label }),
        h("span", { class: "tnum" }, h("b", { text: fmt(m.n) }), h("small", { text: "/" + fmt(m.mark || m.max) }))),
      h("div", { class: "meter-track", role: "meter", "aria-label": m.label, "aria-valuemin": "0", "aria-valuemax": String(m.max), "aria-valuenow": String(m.n) },
        h("div", { class: "meter-fill", style: `width:${Math.min(100, (m.n / Math.max(1, m.mark || m.max)) * 100)}%` })))));
    const fails = S.issues.filter((i) => i.status === E.FAIL).length, warns = S.issues.length - fails;
    const btn = $("issues-btn");
    btn.className = "issues-btn " + (fails ? "fail" : warns ? "warn" : "ok");
    btn.textContent = fails ? `점검 ✕${fails} ▲${warns}` : warns ? `점검 ▲${warns}` : "점검 ✓";
  }

  // ── 화면: 시작 ──
  function renderStart(ed) {
    const name = charName();
    const cfg = S.rules.config;
    let line = `${S.mode} 모드`;
    if (cfg["합계_제한"] && typeof cfg["합계_제한"] === "object") {
      const total = E.checkTotalLength(E.parseMdSections(S.text), cfg)[0];
      line += ` · 설정 크기 ${fmt(total.total)} / ${fmt(total.maximum)}자`;
    }
    const fails = S.issues.filter((i) => i.status === E.FAIL).length;
    if (fails) line += ` · 고칠 곳 ${fails}개`;
    const filled = Object.keys(PV_SLOTS).filter((id) => pvData(id).html.trim());
    ed.replaceChildren(h("div", { class: "start" },
      h("p", { class: "start-lead", text: "무엇을 하시겠어요?" }),
      h("button", { class: "start-card accent", type: "button", onclick: () => go({ kind: "home" }) },
        h("b", { text: "캐릭터 작성" }),
        h("span", { class: "sub", text: "템플릿 칸에 자연어로 채우고, 쓰는 동안 바로 점검합니다." }),
        h("span", { class: "tnum", text: (name || (cardParts().length ? "이름 없는 작품" : "이름 없는 캐릭터")) + " · " + line })),
      h("button", { class: "start-card", type: "button", onclick: () => go({ kind: "preview" }) },
        h("b", { text: "HTML 미리보기" }),
        h("span", { class: "sub", text: "상태창·소개문 HTML을 붙여넣어 폭·배경·변수를 바꿔 보고, 막히는 태그를 확인합니다." }),
        h("span", { class: "tnum", text: filled.length ? `쓰는 중인 칸 ${filled.length}개 · ${filled.map((id) => id.replace(":", " ")).join(", ")}` : "멜로이 · 루모 / 상태창 · 소개문" })),
      h("div", { class: "start-foot" },
        MODES.length > 1 ? h("button", { class: "mode-pill", type: "button", onclick: openModes, text: `${S.mode} 모드 · 바꾸기` }) : null,
        h("span", { class: "muted", text: S.saveOk ? (S.savedAt ? `이 기기에 자동 저장됨 · ${hhmm(S.savedAt)}` : "이 기기에 자동 저장됩니다")
          : "자동 저장이 막혀 있습니다. 내보내기로 따로 보관하세요." }))));
  }

  // ── 이동 ──
  function go(t) {
    S.view = t;
    S.onRecompute = null;
    document.body.dataset.view = ["start", "home", "preview"].includes(t.kind) ? t.kind : "edit";
    const back = $("back-btn");
    back.hidden = t.kind === "start" || t.kind === firstView().kind;
    back.textContent = t.kind === "home" || t.kind === "preview" ? "‹ 처음으로" : "‹ 목차";
    const label = t.kind === "preview" ? "HTML 미리보기" : t.kind === "field" ? S.schema.parts.flatMap((p) => p.fields).find((f) => f.key === t.key)?.label
      : t.kind === "card" ? E.cardLabel(findCard(t) || { name: "" }) : t.part;
    $("top-title").replaceChildren(t.kind === "start" ? "경량봇 작성기"
      : t.kind === "home" ? (APP ? "경량봇 작성기" : "캐릭터 작성") : label || "");
    renderNav(); renderEditor(); renderMeters();
    window.scrollTo({ top: 0 });
  }

  // ── 아래 창 ──
  function sheet(...kids) {
    const close = () => scrim.remove();
    const panel = h("div", { class: "sheet", role: "dialog", "aria-modal": "true" }, ...kids);
    const scrim = h("div", { class: "scrim", onclick: (e) => { if (e.target === scrim) close(); } }, panel);
    $("layer").replaceChildren(scrim);
    panel.querySelector("button, textarea, input")?.focus({ preventScroll: true });
    return { close, panel };
  }
  let toastTimer = null;
  function toast(msg, action) {
    clearTimeout(toastTimer);
    document.querySelector(".toast")?.remove();
    const t = h("div", { class: "toast", role: "status" }, msg,
      action ? h("button", { type: "button", text: action.label, onclick: () => { t.remove(); action.run(); } }) : null);
    document.body.append(t);
    toastTimer = setTimeout(() => t.remove(), action ? 7000 : 2600);
  }

  /** 메뉴는 지금 화면에 필요한 것만 보여 줍니다. (화면에 버튼이 이미 있는 것은 넣지 않음) */
  function openMenu() {
    const list = h("div", { class: "menu-list" });
    const items = { push: (...kids) => list.append(...kids), unshift: (kid) => list.prepend(kid) };
    const s = sheet(h("h2", { text: "메뉴" }), list,
      h("p", { class: "muted", text: "개인이 만든 작성 도구입니다. 작성 내용은 이 기기의 브라우저에만 저장되고 어디에도 보내지 않습니다." }),
      h("button", { class: "btn", type: "button", text: "닫기", onclick: () => s.close() }));
    if (S.view.kind === "preview") {
      const id = PV.slot, [platform, kind] = id.split(":");
      items.push(
        APP ? menuItem(OTHER.label, OTHER.sub, () => { location.href = OTHER.url; })
            : menuItem("캐릭터 작성으로", "지금 쓰던 미리보기 내용은 그대로 남습니다.", () => { s.close(); go({ kind: "home" }); }),
        menuItem(`'${platform} ${kind}' 칸 지우기`, pvData(id).html.trim() ? "지운 뒤 되돌릴 수 있습니다." : "이미 비어 있습니다.", () => {
          s.close();
          const prev = pvData(id).html;
          if (!prev.trim()) { toast("이미 비어 있습니다."); return; }
          pvSetHtml(id, "");
          toast("지웠습니다.", { label: "되돌리기", run: () => pvSetHtml(id, prev) });
        }));
      return;
    }
    items.push(
      menuItem("원자료 양식 받기", "제목에 '#' 이 없는 자연어 양식입니다. AI 어시스턴트에게 주고 이 순서대로 써 달라고 하세요.", () => { s.close(); openSourceForm(); }),
      menuItem("새로 작성", "템플릿 안내 문구가 들어 있는 빈 양식으로 시작합니다.", () => { s.close(); confirmSheet("새로 작성할까요?", "지금 내용은 '직전 작업 되살리기'로 한 번 되돌릴 수 있습니다.", "새로 작성", () => replaceForm(E.defaultForm(S.schema), null, "새 양식으로 시작했습니다.")); }),
      menuItem("직전 작업 되살리기", "붙여넣기·불러오기·새로 작성 바로 전 내용으로 돌아갑니다.", () => { s.close(); restoreBackup(); }),
      menuItem("규칙 바꾸기", S.rules.custom ? "지금은 내가 바꾼 규칙을 쓰고 있습니다." : "PC판 rules 폴더의 템플릿.md / 검수설정.json 을 넣을 수 있습니다.", () => { s.close(); openRules(); }));
    if ((S.view.kind === "start" || APP === "writer") && MODES.length > 1)
      items.unshift(menuItem("모드 바꾸기", `지금 ${S.mode} 모드입니다. 모드마다 작업이 따로 저장됩니다.`, () => { s.close(); openModes(); }));
    if (APP === "writer") { list.append(h("div", { class: "menu-sep" })); items.push(menuItem(OTHER.label, OTHER.sub, () => { location.href = OTHER.url; })); }
  }
  function openModes() {
    const desc = { "경량": "경량봇(1인). 크랙 기준 분량, 멜로이 상태창 변수 포함", "1인": "캐릭터 한 명. 등장인물 0. Core ~ 7. 칸 구성", "다인": "다인챗. 설명 필드 9칸 + 인물별 카드 여러 장" };
    const s = sheet(h("h2", { text: "모드 바꾸기" }),
      h("p", { class: "muted", text: "모드마다 템플릿·점검 기준이 다르고, 작업도 모드별로 따로 저장됩니다. 지금 작업은 그대로 남습니다." }),
      h("div", { class: "menu-list" }, ...MODES.map((m) => menuItem(m === S.mode ? `${m} 모드 (지금)` : `${m} 모드`, desc[m] || "",
        () => { s.close(); switchMode(m); }))),
      h("button", { class: "btn", type: "button", text: "닫기", onclick: () => s.close() }));
  }
  function menuItem(title, sub, run) { return h("button", { type: "button", onclick: run }, h("b", { text: title }), h("span", { text: sub })); }
  function confirmSheet(title, body, okLabel, run) {
    const s = sheet(h("h2", { text: title }), h("p", { class: "muted", text: body }),
      h("div", { class: "quick" }, h("button", { class: "btn primary", type: "button", text: okLabel, onclick: () => { s.close(); run(); } }),

  }

  // 크랙용 묶음: 프롬프트(등장인물+설명) 한 덩어리, 키워드북 노트, 판매면 칸. 변수는 크랙에 없어 넣지 않습니다.
  function crackBundle(text) {
    const lines = E.splitlines(text), secs = E.parseMdSections(text);
    const top = (name) => secs.find((x) => x.level === 1 && E.normalize(x.name) === E.normalize(name));
    const inside = (parent) => parent ? secs.filter((x) => x.start - 2 > parent.start - 2 && x.start - 2 < parent.end) : [];
    // 내용이 없는 소제목은 뺍니다 (세이프티판의 빈 '수위' 칸 등)
    const dropEmpty = (body) => {
      const ls = E.splitlines(body), out = [];
      ls.forEach((l, i) => {
        const m = l.match(/^\s{0,3}(#{1,6})\s/);
        if (m) {
          let j = i + 1;
          while (j < ls.length && !ls[j].trim()) j++;
          const next = ls[j] && ls[j].match(/^\s{0,3}(#{1,6})\s/);
          if (j >= ls.length || (next && next[1].length <= m[1].length)) return;
        }
        out.push(l);
      });
      return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
    };
    const prompt = ["등장인물", "설명"].map(top).filter(Boolean).map((x) => `# ${x.name}\n${dropEmpty(x.body)}`).join("\n\n");
    const lore = top("로어북"), notes = [];
    if (lore) for (const l of E.splitlines(lore.body)) {
      const m = l.match(/^\s*(\d+)\s*[.)]\s*트리거\s*[:：]\s*(.*)$/);
      if (m) notes.push({ key: m[2].trim(), body: [] });
      else if (notes.length && !l.trimStart().startsWith("#")) notes[notes.length - 1].body.push(l);
    }
    const sale = inside(top("판매면")).filter((x) => x.level === 2).map((x) => ({ name: x.name, body: x.body.trim() }));
    return { prompt, notes: notes.map((n) => ({ key: n.key, body: n.body.join("\n").trim() })).filter((n) => n.body || n.key), sale, lines };
  }
